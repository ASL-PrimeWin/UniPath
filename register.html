<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login / Sign Up | UniPath</title><link rel="stylesheet" href="style.css?v=20260911"></head><body><div id="site-nav"></div><main class="page"><div class="container" style="max-width:760px"><div class="page-title" style="text-align:center"><div class="eyebrow">UNIPATH ACCOUNT</div><h1>Login / Sign Up</h1><p>Demo account page for the current MVP. Do not enter a real password.</p></div><div class="panel"><div class="plan-toggle" style="width:max-content;margin:0 auto 22px"><button class="active" id="loginTab" onclick="tab('login')">LOGIN</button><button id="signupTab" onclick="tab('signup')">CREATE ACCOUNT</button></div><div id="box"></div></div></div></main><div id="site-footer"></div><script src="app.js?v=20260911"></script><script>function tab(x){loginTab.classList.toggle('active',x==='login');signupTab.classList.toggle('active',x==='signup');box.innerHTML=x==='login'?`<h2 style="color:#0a397f">Welcome back</h2><input id="email" class="field" placeholder="Email"><br><br><input id="pw" class="field" type="password" placeholder="Demo password"><br><br><button class="btn" onclick="login()">Login</button>`:`<h2 style="color:#0a397f">Create your UniPath account</h2><input id="name" class="field" placeholder="Full name"><br><br><input id="email" class="field" placeholder="Email"><br><br><input id="pw" class="field" type="password" placeholder="Demo password"><br><br><button class="btn" onclick="signup()">Create Account</button>`}function login(){localStorage.setItem('unipathUser',JSON.stringify({email:email.value}));location.href='dashboard.html'}function signup(){localStorage.setItem('unipathUser',JSON.stringify({name:name.value,email:email.value}));location.href='dashboard.html'}tab('login')</script></body></html>
