<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login / Register | UniPath</title><link rel="stylesheet" href="style.css"><link rel="icon" href="favicon.svg"></head><body><div id="site-nav"></div><main class="auth-wrap"><section class="auth-card"><div style="text-align:center"><img src="nipath-logo.png" alt="UniPath" style="width:180px;height:52px;object-fit:contain"><div class="eyebrow">STUDENT ACCOUNT</div><h1 id="authTitle">Welcome to UniPath</h1><p id="authSubtitle">Log in or create a demo account to save your college plan.</p></div><div class="auth-tabs"><button id="loginTab" class="active" onclick="switchAuth('login')">Login</button><button id="registerTab" onclick="switchAuth('register')">Create Account</button></div><form id="authForm" class="auth-form" onsubmit="submitAuth(event)"></form><div class="auth-note">Demo account only: this static GitHub Pages site does not store real passwords or provide real authentication.</div></section></main><div id="site-footer"></div><script src="app.js"></script><script>
let mode='login';function renderAuth(){const r=mode==='register';document.getElementById('authTitle').textContent=r?'Create your UniPath account':'Welcome to UniPath';document.getElementById('authSubtitle').textContent=r?'Save your shortlist and planning workspace locally.':'Log in to continue to your UniPath dashboard.';document.getElementById('loginTab').classList.toggle('active',!r);document.getElementById('registerTab').classList.toggle('active',r);document.getElementById('authForm').innerHTML=r?`<label>Full name<input id="name" required placeholder="Your name"></label><label>Email<input id="email" type="email" required placeholder="you@example.com"></label><label>Password<input id="password" type="password" required placeholder="Demo password"></label><button class="btn" type="submit">Create Demo Account</button>`:`<label>Email<input id="email" type="email" required placeholder="you@example.com"></label><label>Password<input id="password" type="password" required placeholder="Demo password"></label><button class="btn" type="submit">Login</button>`}function switchAuth(m){mode=m;renderAuth()}function submitAuth(e){e.preventDefault();localStorage.setItem('unipathDemoUser',JSON.stringify({mode,email:document.getElementById('email').value,name:document.getElementById('name')?.value||''}));location.href='dashboard.html'}renderAuth();
</script></body></html>
