<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Shortlist | NIPATH</title><link rel="stylesheet" href="style.css"><link rel="icon" href="favicon.svg"></head><body><div id="site-nav"></div><main class="page"><div class="container"><div class="page-title"><div class="eyebrow">DECIDE</div><h1>My Shortlist</h1><p>Turn your matches into a practical Dream, Target and Safe college plan.</p></div><div id="shortlist"></div></div></main><div id="site-footer"></div><script src="data.js"></script><script src="app.js"></script><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function getMatches(){return JSON.parse(localStorage.getItem('unipathMatches')||'[]').map(getCollege).filter(Boolean)}
function saveTier(id,tier){let x=JSON.parse(localStorage.getItem('unipathTiers')||'{}');x[id]=tier;localStorage.setItem('unipathTiers',JSON.stringify(x));draw()}
function draw(){let ms=getMatches(),tiers=JSON.parse(localStorage.getItem('unipathTiers')||'{}');if(!ms.length){document.getElementById('shortlist').innerHTML='<div class="empty"><h2>Your shortlist is empty</h2><p>Complete Find My College first.</p><a class="btn" href="find.html">Start Find My College</a></div>';return}let groups={dream:[],target:[],safe:[]};ms.forEach((c,i)=>{let t=tiers[c.id]||(i<2?'dream':i<6?'target':'safe');groups[t].push(c)});document.getElementById('shortlist').innerHTML=`<div class="tier-grid">${Object.entries(groups).map(([k,arr])=>`<section class="tier ${k}"><h3>${k==='dream'?'🟣 Dream':k==='target'?'🔵 Target':'🟢 Safe'}</h3><p class="muted">${k==='dream'?'Reach options.':k==='target'?'Strong realistic options.':'Backup options worth applying to.'}</p><div class="mini-list">${arr.length?arr.map(c=>`<div class="mini-item"><div><strong>${esc(c.name)}</strong><div class="muted">${esc(c.category)}</div></div><a class="btn small outline" href="college.html?id=${encodeURIComponent(c.id)}">View</a></div>`).join(''):'<div class="muted">No colleges here yet.</div>'}</div></section>`).join('')}</div><section class="panel" style="margin-top:18px"><h2>Reclassify</h2><p class="muted">Move any saved college between Dream, Target and Safe.</p><div class="mini-list">${ms.map(c=>`<div class="mini-item"><strong>${esc(c.name)}</strong><div><button class="filter-chip" onclick="saveTier('${c.id}','dream')">Dream</button><button class="filter-chip" onclick="saveTier('${c.id}','target')">Target</button><button class="filter-chip" onclick="saveTier('${c.id}','safe')">Safe</button></div></div>`).join('')}</div></section>`}
draw();</script></body></html>
