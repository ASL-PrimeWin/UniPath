<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>College Search | UniPath</title><link rel="stylesheet" href="style.css"><link rel="icon" href="favicon.png"></head><body><div id="site-nav"></div><main class="page"><div class="container"><div class="page-title"><div class="eyebrow">DISCOVER</div><h1>College Search</h1><p>Search the complete <strong id="totalLabel">906</strong>-institution UniPath dataset. Results are ranked by relevance to your search and filters.</p></div><div class="search-layout"><aside class="panel filter-panel"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h3 style="margin:0">Filter Colleges</h3><button class="btn outline small" type="button" onclick="resetFilters()">Clear all</button></div><div class="filter-stack"><div class="filter-group"><label for="q">Search colleges, courses, exams...</label><input id="q" class="field" placeholder="e.g. IIT Madras, B.Tech, JEE" autocomplete="off"></div><div class="filter-group"><label for="category">NIRF / category</label><select id="category" class="field"><option value="">All categories</option></select></div><div class="filter-group"><label for="program">Programme</label><select id="program" class="field"><option value="">All programmes</option></select></div><div class="filter-group"><label for="exam">Entrance route</label><select id="exam" class="field"><option value="">Any entrance route</option></select></div><div class="filter-group"><label for="mode">Study mode</label><select id="mode" class="field"><option value="">Any study mode</option><option>Residential</option><option>On-campus</option><option>Online</option><option>Distance</option><option>Hybrid</option></select></div><div class="filter-group"><label for="hostel">Hostel</label><select id="hostel" class="field"><option value="">Any</option><option value="yes">Hostel listed</option><option value="no">No hostel listed</option></select></div><div class="filter-group"><label for="fee">Fee text contains</label><input id="fee" class="field" placeholder="e.g. lakh, ₹1,00,000"></div><div class="filter-hint">Every text field searches across the full college record, including programmes, courses, eligibility, entrance, mode and fee text.</div></div></aside><section><div id="summary" class="search-summary"></div><div class="results-toolbar-v2"><strong id="count"></strong><select id="sort" class="field" style="max-width:200px"><option value="relevance">Sort: Relevance</option><option value="rank">Sort: NIRF rank</option><option value="name">Sort: A–Z</option><option value="programs">Sort: Programme count</option></select></div><div id="results"></div></section></div></div></main><div id="site-footer"></div><script src="data.js"></script><script src="app.js"></script><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const lower=s=>String(s??'').toLowerCase();
const cats=[...new Set([...NIRF_CATEGORIES,...COLLEGES.map(c=>c.category)])].sort((a,b)=>a.localeCompare(b));
const programs=[...new Set(COLLEGES.flatMap(c=>(c.programs||[]).map(p=>p.programme).filter(Boolean)))].sort((a,b)=>a.localeCompare(b));
const exams=[...new Set(COLLEGES.flatMap(c=>(c.programs||[]).map(p=>p.entrance).filter(Boolean)))].sort((a,b)=>a.localeCompare(b));
for(const v of cats)document.getElementById('category').insertAdjacentHTML('beforeend',`<option value="${esc(v)}">${esc(v)}</option>`);
for(const v of programs)document.getElementById('program').insertAdjacentHTML('beforeend',`<option value="${esc(v)}">${esc(v)}</option>`);
for(const v of exams)document.getElementById('exam').insertAdjacentHTML('beforeend',`<option value="${esc(v)}">${esc(v.length>75?v.slice(0,72)+'…':v)}</option>`);
function corpus(c){return[c.name,c.category,c.exam,c.hostel?'hostel':'',...(c.programs||[]).flatMap(p=>Object.values(p))].join(' ')}
function scoreText(text,q){if(!q)return 0;const t=lower(text),terms=lower(q).split(/\s+/).filter(Boolean);let s=0;for(const term of terms){if(t===term)s+=30;else if(lower(text).includes(term))s+=term.length>3?8:4}return s}
function getResults(){const q=document.getElementById('q').value.trim(),cat=document.getElementById('category').value,prog=document.getElementById('program').value,exam=lower(document.getElementById('exam').value),mode=lower(document.getElementById('mode').value),host=document.getElementById('hostel').value,fee=lower(document.getElementById('fee').value.trim()),sort=document.getElementById('sort').value;let list=[];for(const c of COLLEGES){const ps=c.programs||[],text=corpus(c),t=lower(text);if(cat&&c.category!==cat)continue;if(prog&&!ps.some(p=>p.programme===prog))continue;if(exam&&!ps.some(p=>lower(p.entrance).includes(exam)))continue;if(mode&&!ps.some(p=>lower(p.mode).includes(mode)))continue;if(host==='yes'&&!c.hostel)continue;if(host==='no'&&c.hostel)continue;if(fee&&!ps.some(p=>lower(p.fees).includes(fee)))continue;if(q){const terms=lower(q).split(/\s+/).filter(Boolean);if(!terms.every(term=>t.includes(term)))continue}const rel=scoreText(text,q);list.push({c,rel})}if(sort==='programs')list.sort((a,b)=>(b.c.programs||[]).length-(a.c.programs||[]).length||a.c.name.localeCompare(b.c.name));else if(sort==='name')list.sort((a,b)=>a.c.name.localeCompare(b.c.name));else if(sort==='rank')list.sort((a,b)=>{const ar=lookupNirfRank(a.c.category,a.c.name),br=lookupNirfRank(b.c.category,b.c.name);return (ar??9999)-(br??9999)||a.c.name.localeCompare(b.c.name)});else list.sort((a,b)=>b.rel-a.rel||a.c.name.localeCompare(b.c.name));return list}
function render(items){document.getElementById('count').textContent=`${items.length.toLocaleString('en-IN')} matching institutions`;document.getElementById('summary').textContent=items.length===COLLEGES.length?'Showing all 906 institutions.':'Showing '+items.length.toLocaleString('en-IN')+' of '+COLLEGES.length.toLocaleString('en-IN')+' institutions after your filters.';document.getElementById('results').innerHTML=items.length?items.slice(0,200).map(({c})=>{const rank=lookupNirfRank(c.category,c.name);const progs=[...new Set((c.programs||[]).map(p=>p.programme).filter(Boolean))].slice(0,4).join(' · ');const entrances=[...new Set((c.programs||[]).map(p=>p.entrance).filter(Boolean))].slice(0,2).join(' · ');return `<article class="result-card-v2"><div><div class="eyebrow">${esc(c.category)}</div><h2>${esc(c.name)}</h2><p>${esc(progs||'Programme information available')}</p><p>${esc(entrances||'Entrance route listed in profile')}</p><div class="result-meta-v2"><span class="result-tag-v2">${rank==null?'NIRF rank unavailable':'NIRF #'+rank}</span><span class="result-tag-v2">${c.programs.length} programme entries</span><span class="result-tag-v2">${c.hostel?'Hostel listed':'Hostel not listed'}</span></div></div><div class="result-actions-v2"><a class="btn small" href="college.html?id=${encodeURIComponent(c.id)}">View Details</a><button class="btn small outline" onclick="addCompare('${esc(c.id)}')">Compare</button></div></article>`}).join(''):`<div class="empty"><h2>No matching colleges</h2><p>Try fewer keywords or clear a filter.</p></div>`}
function applyFilters(){render(getResults())}
function resetFilters(){document.getElementById('q').value='';document.getElementById('fee').value='';for(const id of ['category','program','exam','mode','hostel','sort'])document.getElementById(id).selectedIndex=0;applyFilters()}
function addCompare(id){let a=JSON.parse(localStorage.getItem('unipathCompare')||'[]');if(!a.includes(id))a.push(id);if(a.length>2)a=a.slice(-2);localStorage.setItem('unipathCompare',JSON.stringify(a));location.href='compare.html'}
const qp=new URLSearchParams(location.search);if(qp.get('q'))document.getElementById('q').value=qp.get('q');if(qp.get('category'))document.getElementById('category').value=qp.get('category');if(qp.get('program'))document.getElementById('program').value=qp.get('program');if(qp.get('exam'))document.getElementById('exam').value=qp.get('exam');if(qp.get('mode'))document.getElementById('mode').value=qp.get('mode');
for(const id of ['q','category','program','exam','mode','hostel','fee','sort']){const el=document.getElementById(id);el.addEventListener(id==='q'||id==='fee'?'input':'change',applyFilters)}
applyFilters();
</script></body></html>
