<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>College Search | UniPath</title><link rel="stylesheet" href="style.css"><link rel="icon" href="favicon.png"></head><body><div id="site-nav"></div><main class="page"><div class="container"><div class="page-title"><div class="eyebrow">DISCOVER</div><h1>College Search</h1><p>Search across the complete <strong id="totalLabel">906</strong>-institution UniPath free-tier database.</p></div><div class="search-layout"><aside class="panel filter-panel"><h3>Filter Colleges</h3><div class="filter-stack"><div class="filter-group"><label>Search everything</label><input id="q" class="field" placeholder="College, course, exam, fee..."></div><div class="filter-group"><label>Category</label><select id="category" class="field"><option value="">All categories</option></select></div><div class="filter-group"><label>Programme</label><select id="program" class="field"><option value="">All programmes</option></select></div><div class="filter-group"><label>Entrance exam</label><select id="exam" class="field"><option value="">Any entrance route</option></select></div><div class="filter-group"><label>Study mode</label><select id="mode" class="field"><option value="">Any mode</option><option>Residential</option><option>On-campus</option><option>Online</option><option>Distance</option></select></div><div class="filter-group"><label>Hostel</label><select id="hostel" class="field"><option value="">Any</option><option value="yes">Hostel listed</option><option value="no">No hostel listed</option></select></div><div class="filter-group"><label>Minimum fee text</label><input id="fee" class="field" placeholder="e.g. 2 lakh"></div><div class="range-row"><button class="btn outline" onclick="resetFilters()">Reset</button><button class="btn" onclick="applyFilters()">Apply</button></div></div></aside><section><div id="summary" class="search-summary"></div><div class="results-toolbar-v2"><strong id="count"></strong><select id="sort" class="field" style="max-width:190px" onchange="applyFilters()"><option value="name">Sort: A–Z</option><option value="programs">Sort: Programme count</option></select></div><div id="results"></div></section></div></div></main><div id="site-footer"></div><script src="data.js"></script><script src="app.js"></script><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const cats=[...new Set(COLLEGES.map(c=>c.category))].sort();cats.forEach(c=>document.getElementById('category').insertAdjacentHTML('beforeend',`<option value="${esc(c)}">${esc(c)}</option>`));
const progs=[...new Set(COLLEGES.flatMap(c=>(c.programs||[]).map(p=>p.programme).filter(Boolean)))].sort((a,b)=>a.localeCompare(b));progs.forEach(p=>document.getElementById('program').insertAdjacentHTML('beforeend',`<option value="${esc(p)}">${esc(p)}</option>`));
const exams=[...new Set(COLLEGES.flatMap(c=>(c.programs||[]).map(p=>p.entrance).filter(Boolean)))] .sort((a,b)=>a.localeCompare(b));exams.slice(0,160).forEach(e=>document.getElementById('exam').insertAdjacentHTML('beforeend',`<option value="${esc(e)}">${esc(e.length>80?e.slice(0,77)+'…':e)}</option>`));
function corpus(c){return [c.name,c.category,c.exam,c.hostel?'hostel':'',...(c.programs||[]).flatMap(p=>Object.values(p))].join(' ').toLowerCase()}
function getResults(){const q=document.getElementById('q').value.trim().toLowerCase(),cat=document.getElementById('category').value,prog=document.getElementById('program').value,exam=document.getElementById('exam').value.toLowerCase(),mode=document.getElementById('mode').value.toLowerCase(),host=document.getElementById('hostel').value,fee=document.getElementById('fee').value.trim().toLowerCase();let list=COLLEGES.filter(c=>{const text=corpus(c), ps=c.programs||[];return(!q||text.includes(q))&&(!cat||c.category===cat)&&(!prog||ps.some(p=>p.programme===prog))&&(!exam||ps.some(p=>String(p.entrance||'').toLowerCase().includes(exam)))&&(!mode||ps.some(p=>String(p.mode||'').toLowerCase().includes(mode)))&&(!host||(host==='yes'&&c.hostel)||(host==='no'&&!c.hostel))&&(!fee||ps.some(p=>String(p.fees||'').toLowerCase().includes(fee)));});const sort=document.getElementById('sort').value;if(sort==='programs')list.sort((a,b)=>b.programs.length-a.programs.length);else list.sort((a,b)=>a.name.localeCompare(b.name));return list}
function render(list){document.getElementById('count').textContent=`${list.length.toLocaleString('en-IN')} matching institutions`;document.getElementById('summary').textContent=list.length===COLLEGES.length?'Showing the full database.':`Showing ${list.length.toLocaleString('en-IN')} of ${COLLEGES.length.toLocaleString('en-IN')} institutions after applying your filters.`;document.getElementById('results').innerHTML=list.length?list.map(c=>{const courses=[...new Set((c.programs||[]).map(p=>p.programme).filter(Boolean))].slice(0,4).join(' · ');const entrance=[...new Set((c.programs||[]).map(p=>p.entrance).filter(Boolean))].slice(0,1).join('');return `<article class="result-card-v2"><div><div class="eyebrow">${esc(c.category)}</div><h2>${esc(c.name)}</h2><p>${esc(courses||'Programme information available')}</p><p>${esc(entrance||'Entrance route listed in profile')}</p><div class="result-meta-v2"><span class="result-tag-v2">${c.programs.length} programmes</span><span class="result-tag-v2">${c.hostel?'Hostel listed':'Hostel not listed'}</span></div></div><div class="result-actions-v2"><a class="btn small" href="college.html?id=${encodeURIComponent(c.id)}">View Details</a><button class="btn small outline" onclick="addCompare('${c.id}')">Compare</button></div></article>`}).join(''):'<div class="empty"><h2>No matching colleges</h2><p>Try a broader keyword or reset the filters.</p></div>'}
function applyFilters(){render(getResults())}
function resetFilters(){['q','fee'].forEach(id=>document.getElementById(id).value='');['category','program','exam','mode','hostel','sort'].forEach(id=>document.getElementById(id).selectedIndex=0);applyFilters()}
function addCompare(id){let a=JSON.parse(localStorage.getItem('unipathCompare')||'[]');if(!a.includes(id))a.push(id);if(a.length>2)a=a.slice(-2);localStorage.setItem('unipathCompare',JSON.stringify(a));window.location.href='compare.html'}
const qp=new URLSearchParams(location.search).get('q');if(qp)document.getElementById('q').value=qp;document.getElementById('q').addEventListener('input',()=>applyFilters());applyFilters();
</script></body></html>
