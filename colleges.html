<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>College Search | UniPath</title><link rel="stylesheet" href="style.css"><link rel="icon" href="favicon.svg"></head><body><div id="site-nav"></div><main class="page"><div class="container"><div class="page-title"><div class="eyebrow">DISCOVER</div><h1>College Search</h1><p>Filter colleges by what matters to you.</p></div><section class="panel"><div class="filters"><input id="q" class="field" placeholder="College, course or city"><select id="category" class="field"><option value="">All categories</option><option>Engineering</option><option>Management</option><option>Medical</option><option>Law</option></select><select id="state" class="field"><option value="">All states</option></select><input id="fee" class="field" type="number" placeholder="Max annual fees ₹"><button class="btn" onclick="apply()">Apply Filters</button></div></section><div class="results-head"><h2>Colleges</h2><span id="count" class="muted"></span></div><div id="results" class="card-list"></div></div></main><div id="site-footer"></div><script src="data.js"></script><script src="app.js"></script><script>
const st=document.getElementById('state');[...new Set(COLLEGES.map(c=>c.state))].sort().forEach(s=>st.insertAdjacentHTML('beforeend',`<option>${s}</option>`));
function render(list){document.getElementById('count').textContent=list.length+' college'+(list.length===1?'':'s')+' found';document.getElementById('results').innerHTML=list.length?list.map(c=>`<article class="college-card"><div><div class="rank">NIRF RANK #${c.rank}</div><h2>${c.name}</h2><div class="meta">${c.category} · ${c.city}, ${c.state}</div><div class="meta">Fees: ${money(c.fees)}/year · Entrance: ${c.exam}</div><div><span class="tag">${c.category}</span><span class="tag">${c.hostel?'Hostel available':'Check hostel'}</span></div></div><div class="card-actions"><a class="btn small" href="college.html?id=${c.id}">View Details</a><button class="btn small outline" onclick="compare('${c.id}')">Compare</button></div></article>`).join(''):`<div class="empty"><h2>No colleges found</h2><p>Try changing your filters.</p></div>`}
function apply(){let q=document.getElementById('q').value.toLowerCase().trim(),cat=document.getElementById('category').value,s=document.getElementById('state').value,f=document.getElementById('fee').value;render(COLLEGES.filter(c=>(!q||[c.name,c.category,c.city,c.state,...c.courses].join(' ').toLowerCase().includes(q))&&(!cat||c.category===cat)&&(!s||c.state===s)&&(!f||c.fees<=Number(f))))}
function compare(id){let a=JSON.parse(localStorage.getItem('unipathCompare')||'[]');if(!a.includes(id))a.push(id);if(a.length>2)a=a.slice(-2);localStorage.setItem('unipathCompare',JSON.stringify(a));alert('Added to comparison. Open Compare from the navigation.')}let q=new URLSearchParams(location.search).get('q');document.getElementById('q').value=q||'';render(COLLEGES);if(q)apply();document.getElementById('q').addEventListener('keydown',e=>e.key==='Enter'&&apply());</script></body></html>
