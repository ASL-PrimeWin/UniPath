<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>College Search | UniPath</title><link rel="stylesheet" href="style.css?v=20260911"></head><body><div id="site-nav"></div><main class="page"><div class="container"><div class="page-title"><div class="eyebrow">DISCOVER</div><h1>Explore Colleges</h1><p>Search the complete UniPath team database, not a ten-college demo pretending to be a database.</p></div><section class="panel"><div class="filters"><input id="q" class="field" placeholder="Search college, course, programme, city, exam..."><select id="category" class="field"><option value="">All categories</option></select><select id="state" class="field"><option value="">All detected states</option></select><select id="exam" class="field"><option value="">Any entrance exam</option></select><select id="mode" class="field"><option value="">Any study mode</option></select><input id="fee" class="field" type="number" placeholder="Max fee ₹"><button class="btn" onclick="apply()">Apply</button></div></section><div class="results-head"><h2>College results</h2><span id="count" class="muted"></span></div><div id="results" class="card-list"></div></div></main><div id="site-footer"></div><script src="data.js?v=20260911"></script><script src="app.js?v=20260911"></script><script>const params=new URLSearchParams(location.search);const qEl=document.getElementById('q');qEl.value=params.get('q')||'';function opts(){[...new Set(COLLEGES.map(c=>c.category).filter(Boolean))].sort().forEach(x=>category.insertAdjacentHTML('beforeend',`<option>${x}</option>`));[...new Set(COLLEGES.map(c=>c.state).filter(Boolean))].sort().forEach(x=>state.insertAdjacentHTML('beforeend',`<option>${x}</option>`));[...new Set(COLLEGES.flatMap(c=>c.programmes.map(p=>p.entrance)).filter(x=>x&&x.length<55))].sort().slice(0,100).forEach(x=>exam.insertAdjacentHTML('beforeend',`<option>${x}</option>`));[...new Set(COLLEGES.flatMap(c=>c.programmes.map(p=>p.mode)).filter(Boolean))].sort().slice(0,40).forEach(x=>mode.insertAdjacentHTML('beforeend',`<option>${x}</option>`));if(params.get('category'))category.value=params.get('category');if(params.get('exam'))exam.value=params.get('exam')}function apply(){const q=qEl.value.toLowerCase().trim(),cat=category.value,st=state.value,ex=exam.value,md=mode.value,feeMax=Number(document.getElementById('fee').value)||Infinity;let list=COLLEGES.filter(c=>{const text=c.search||'';const ps=c.programmes;return(!q||text.includes(q))&&(!cat||c.category===cat)&&(!st||c.state===st)&&(!ex||ps.some(p=>p.entrance===ex))&&(!md||ps.some(p=>p.mode===md))&&(c.minFee==null||c.minFee<=feeMax)});render(list)}function render(list){document.getElementById('count').textContent=list.length.toLocaleString('en-IN')+' college records found';document.getElementById('results').innerHTML=list.slice(0,120).map(c=>{const rank=c.nirfRank?`NIRF 2025 #${c.nirfRank}`:'NIRF rank not imported';const loc=[c.city,c.state].filter(Boolean).join(', ')||'Location not listed in team CSV';const p=c.programmes[0];return `<article class="college-card"><div><div class="rank">${rank}</div><h2>${esc(c.name)}</h2><div class="meta">${esc(c.category)} · ${esc(loc)}</div><div class="meta">${p?esc(p.programme)+' · '+esc(p.entrance||'Entrance route not listed'): 'Programme information available in record'}</div><div><span class="tag">${c.programmes.length} programme entries</span>${c.minFee?`<span class="tag">From ${money(c.minFee)}</span>`:''}</div></div><div class="card-actions"><a class="btn small" href="college.html?id=${encodeURIComponent(c.id)}">View Details</a><button class="btn outline small" onclick="compare('${c.id}')">Compare</button></div></article>`}).join('')+(list.length>120?`<div class="notice">Showing the first 120 matching records for speed. Your search still ran against the full ${COLLEGES.length.toLocaleString('en-IN')} records.</div>`:'')||`<div class="empty"><h2>No matching colleges</h2><p>Try a broader search or remove a filter.</p></div>`}function esc(s){return String(s||'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\\':'&#92;'}[m]))}function compare(id){let a=JSON.parse(localStorage.getItem('unipathCompare')||'[]');if(!a.includes(id))a.push(id);a=a.slice(-2);localStorage.setItem('unipathCompare',JSON.stringify(a));location.href='compare.html'}qEl.addEventListener('keydown',e=>e.key==='Enter'&&apply());opts();apply()</script></body></html>
