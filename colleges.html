<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>College Search | UniPath</title>

<style>
/* =========================
   UNIPATH COLLEGE SEARCH
   ========================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f4f7fb;
    color: #172033;
}

/* NAVBAR */

.nav {
    height: 72px;
    background: #071b3a;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 6%;
    color: white;
}

.brand {
    color: white;
    text-decoration: none;
    font-size: 23px;
    font-weight: 800;
}

.brand span {
    color: #4d91ff;
}

.nav-links {
    display: flex;
    gap: 8px;
    align-items: center;
}

.nav-links a {
    color: #dce7f7;
    text-decoration: none;
    padding: 10px 12px;
    border-radius: 7px;
    font-size: 14px;
    font-weight: 600;
}

.nav-links a:hover {
    background: rgba(255,255,255,0.1);
    color: white;
}

.nav-links .active {
    background: #1769e0;
    color: white;
}

/* PAGE */

.container {
    width: min(1200px, 92%);
    margin: auto;
    padding: 55px 0 80px;
}

.eyebrow {
    color: #1769e0;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 2px;
    margin-bottom: 10px;
}

h1 {
    font-size: 46px;
    color: #071b3a;
    margin-bottom: 10px;
}

.subtitle {
    color: #657287;
    font-size: 17px;
    margin-bottom: 32px;
}

/* SEARCH AREA */

.search-panel {
    background: white;
    border: 1px solid #dfe6f0;
    border-radius: 16px;
    padding: 25px;
    box-shadow: 0 8px 25px rgba(20,40,80,0.07);
    margin-bottom: 35px;
}

.search-grid {
    display: grid;
    grid-template-columns: 2fr 1fr 1fr 1fr auto;
    gap: 12px;
}

.field {
    width: 100%;
    padding: 12px 13px;
    border: 1px solid #ccd5e3;
    border-radius: 8px;
    font-size: 14px;
    outline: none;
    background: white;
}

.field:focus {
    border-color: #1769e0;
    box-shadow: 0 0 0 3px rgba(23,105,224,0.12);
}

.button {
    border: none;
    background: #1769e0;
    color: white;
    padding: 12px 20px;
    border-radius: 8px;
    font-weight: 700;
    cursor: pointer;
}

.button:hover {
    background: #0d55bd;
}

/* RESULTS HEADER */

.results-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
}

.results-header h2 {
    font-size: 22px;
    color: #071b3a;
}

.count {
    color: #657287;
    font-size: 14px;
}

/* COLLEGE CARD */

.college-list {
    display: grid;
    gap: 16px;
}

.college-card {
    background: white;
    border: 1px solid #dfe6f0;
    border-radius: 15px;
    padding: 24px;
    display: flex;
    justify-content: space-between;
    gap: 25px;
    transition: 0.2s;
}

.college-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 28px rgba(20,40,80,0.1);
}

.rank {
    color: #1769e0;
    font-weight: 800;
    font-size: 14px;
    margin-bottom: 5px;
}

.college-name {
    font-size: 23px;
    color: #071b3a;
    margin-bottom: 7px;
}

.meta {
    color: #657287;
    font-size: 14px;
    margin: 5px 0;
}

.tags {
    margin-top: 13px;
}

.tag {
    display: inline-block;
    background: #edf4ff;
    color: #1769e0;
    padding: 5px 9px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 700;
    margin-right: 5px;
}

.card-actions {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 9px;
    min-width: 120px;
}

.details-button,
.compare-button {
    text-align: center;
    padding: 10px 13px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    text-decoration: none;
}

.details-button {
    background: #1769e0;
    color: white;
}

.details-button:hover {
    background: #0d55bd;
}

.compare-button {
    background: white;
    color: #1769e0;
    border: 1px solid #cddbf0;
}

.compare-button:hover {
    background: #edf4ff;
}

/* EMPTY */

.no-results {
    background: white;
    border: 1px solid #dfe6f0;
    border-radius: 15px;
    padding: 50px;
    text-align: center;
    color: #657287;
}

/* FOOTER */

footer {
    background: #06172f;
    color: #aebbd0;
    text-align: center;
    padding: 30px;
    font-size: 13px;
}

/* MOBILE */

@media(max-width: 950px) {

    .nav {
        height: auto;
        padding: 18px 5%;
        flex-direction: column;
        gap: 15px;
    }

    .nav-links {
        flex-wrap: wrap;
        justify-content: center;
    }

    .search-grid {
        grid-template-columns: 1fr 1fr;
    }

    .search-grid .field:first-child {
        grid-column: 1 / -1;
    }

    .search-grid .button {
        grid-column: 1 / -1;
    }
}

@media(max-width: 650px) {

    .container {
        width: 92%;
        padding-top: 35px;
    }

    h1 {
        font-size: 36px;
    }

    .search-grid {
        grid-template-columns: 1fr;
    }

    .search-grid .field:first-child,
    .search-grid .button {
        grid-column: auto;
    }

    .college-card {
        flex-direction: column;
    }

    .card-actions {
        flex-direction: row;
    }

    .card-actions a,
    .card-actions button {
        flex: 1;
    }
}
</style>
</head>

<body>

<!-- NAVIGATION -->

<header class="nav">

    <a href="index.html" class="brand">
        UNI<span>PATH</span>
    </a>

    <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="colleges.html" class="active">Colleges</a>
        <a href="rankings.html">NIRF Rankings</a>
        <a href="exams.html">Exams</a>
        <a href="find.html">Find My College</a>
        <a href="dashboard.html">Dashboard</a>
    </nav>

</header>


<!-- MAIN -->

<main class="container">

    <div class="eyebrow">DISCOVER</div>

    <h1>College Search</h1>

    <p class="subtitle">
        Find colleges based on what matters to you.
    </p>


    <!-- SEARCH -->

    <section class="search-panel">

        <div class="search-grid">

            <input
                id="search"
                class="field"
                type="text"
                placeholder="College or course"
            >

            <select id="category" class="field">
                <option value="">All categories</option>
                <option value="Engineering">Engineering</option>
                <option value="Management">Management</option>
                <option value="Medical">Medical</option>
                <option value="Law">Law</option>
            </select>

            <select id="state" class="field">
                <option value="">All states</option>
                <option value="Tamil Nadu">Tamil Nadu</option>
                <option value="Delhi">Delhi</option>
                <option value="Maharashtra">Maharashtra</option>
                <option value="West Bengal">West Bengal</option>
                <option value="Karnataka">Karnataka</option>
                <option value="Telangana">Telangana</option>
                <option value="Uttar Pradesh">Uttar Pradesh</option>
            </select>

            <input
                id="fees"
                class="field"
                type="number"
                placeholder="Max annual fees ₹"
            >

            <button class="button" onclick="searchColleges()">
                Search
            </button>

        </div>

    </section>


    <!-- RESULTS -->

    <div class="results-header">

        <h2>Top Colleges</h2>

        <span id="count" class="count">
            10 colleges found
        </span>

    </div>


    <div id="collegeList" class="college-list"></div>

</main>


<footer>
    © 2026 UniPath · Find Your Right Path
</footer>


<script>

/* =========================
   COLLEGE DATA
   ========================= */

const colleges = [

    {
        name: "IIT Madras",
        category: "Engineering",
        state: "Tamil Nadu",
        city: "Chennai",
        fees: 250000,
        exam: "JEE Advanced",
        rank: 1,
        hostel: true
    },

    {
        name: "IIT Delhi",
        category: "Engineering",
        state: "Delhi",
        city: "New Delhi",
        fees: 240000,
        exam: "JEE Advanced",
        rank: 2,
        hostel: true
    },

    {
        name: "IIT Bombay",
        category: "Engineering",
        state: "Maharashtra",
        city: "Mumbai",
        fees: 230000,
        exam: "JEE Advanced",
        rank: 3,
        hostel: true
    },

    {
        name: "IIT Kharagpur",
        category: "Engineering",
        state: "West Bengal",
        city: "Kharagpur",
        fees: 225000,
        exam: "JEE Advanced",
        rank: 4,
        hostel: true
    },

    {
        name: "IIT Kanpur",
        category: "Engineering",
        state: "Uttar Pradesh",
        city: "Kanpur",
        fees: 220000,
        exam: "JEE Advanced",
        rank: 5,
        hostel: true
    },

    {
        name: "IIT Hyderabad",
        category: "Engineering",
        state: "Telangana",
        city: "Hyderabad",
        fees: 210000,
        exam: "JEE Advanced",
        rank: 7,
        hostel: true
    },

    {
        name: "IIT Guwahati",
        category: "Engineering",
        state: "Assam",
        city: "Guwahati",
        fees: 215000,
        exam: "JEE Advanced",
        rank: 8,
        hostel: true
    },

    {
        name: "NIT Trichy",
        category: "Engineering",
        state: "Tamil Nadu",
        city: "Tiruchirappalli",
        fees: 180000,
        exam: "JEE Main",
        rank: 9,
        hostel: true
    },

    {
        name: "NIT Karnataka",
        category: "Engineering",
        state: "Karnataka",
        city: "Surathkal",
        fees: 175000,
        exam: "JEE Main",
        rank: 17,
        hostel: true
    },

    {
        name: "IIM Bangalore",
        category: "Management",
        state: "Karnataka",
        city: "Bengaluru",
        fees: 1200000,
        exam: "CAT",
        rank: 2,
        hostel: true
    }

];


/* =========================
   DISPLAY COLLEGES
   ========================= */

function displayColleges(list) {

    const container = document.getElementById("collegeList");

    const count = document.getElementById("count");

    count.textContent =
        list.length + (list.length === 1 ? " college found" : " colleges found");


    if (list.length === 0) {

        container.innerHTML = `
            <div class="no-results">
                <h2>No colleges found</h2>
                <p>Try changing your filters.</p>
            </div>
        `;

        return;
    }


    container.innerHTML = list.map(college => `

        <article class="college-card">

            <div>

                <div class="rank">
                    NIRF #${college.rank}
                </div>

                <h2 class="college-name">
                    ${college.name}
                </h2>

                <p class="meta">
                    ${college.category} ·
                    ${college.city}, ${college.state}
                </p>

                <p class="meta">
                    Fees: ₹${college.fees.toLocaleString("en-IN")} / year
                    · Exam: ${college.exam}
                </p>

                <div class="tags">

                    <span class="tag">
                        ${college.category}
                    </span>

                    ${college.hostel ? `
                        <span class="tag">
                            Hostel Available
                        </span>
                    ` : ""}

                </div>

            </div>


            <div class="card-actions">

                <a
                    href="college.html?name=${encodeURIComponent(college.name)}"
                    class="details-button"
                >
                    View Details
                </a>

                <button
                    class="compare-button"
                    onclick="addCompare('${college.name}')"
                >
                    Compare
                </button>

            </div>

        </article>

    `).join("");
}


/* =========================
   SEARCH
   ========================= */

function searchColleges() {

    const search =
        document.getElementById("search").value
        .toLowerCase()
        .trim();

    const category =
        document.getElementById("category").value;

    const state =
        document.getElementById("state").value;

    const feesValue =
        document.getElementById("fees").value;

    const maxFees =
        feesValue === "" ? Infinity : Number(feesValue);


    const filtered = colleges.filter(college => {

        const matchesSearch =
            search === "" ||
            college.name.toLowerCase().includes(search) ||
            college.category.toLowerCase().includes(search) ||
            college.city.toLowerCase().includes(search);

        const matchesCategory =
            category === "" ||
            college.category === category;

        const matchesState =
            state === "" ||
            college.state === state;

        const matchesFees =
            college.fees <= maxFees;


        return (
            matchesSearch &&
            matchesCategory &&
            matchesState &&
            matchesFees
        );

    });


    displayColleges(filtered);
}


/* =========================
   COMPARE
   ========================= */

function addCompare(name) {

    let compare =
        JSON.parse(localStorage.getItem("unipathCompare") || "[]");


    if (!compare.includes(name)) {

        compare.push(name);

        localStorage.setItem(
            "unipathCompare",
            JSON.stringify(compare)
        );

        alert(
            name + " added to comparison."
        );

    } else {

        alert(
            name + " is already in comparison."
        );

    }

}


/* =========================
   ENTER KEY SEARCH
   ========================= */

document
    .getElementById("search")
    .addEventListener("keydown", function(event) {

        if (event.key === "Enter") {
            searchColleges();
        }

    });


/* =========================
   INITIAL LOAD
   ========================= */

displayColleges(colleges);

</script>

</body>
</html>
