<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>College Search | UniPath</title><link rel="stylesheet" href="style.css"></head><body><header class="nav"><a class="brand" href="index.html">UNI<span>PATH</span><small>FIND YOUR RIGHT PATH</small></a><nav><a href="colleges.html">Colleges</a><a href="rankings.html">NIRF Rankings</a><a href="exams.html">Exams</a><a href="find.html">Find My College</a><a href="dashboard.html">Dashboard</a></nav></header>
<section><span class="eyebrow">DISCOVER</span><h1>College Search</h1><p>Filter colleges by what matters to you.</p>
<div style="display:grid;grid-template-columns:250px 1fr;gap:25px;margin-top:30px"><aside class="panel"><input id="q" class="field" placeholder="College or course"><select id="category" class="field"><option value="">All categories</option><option>Engineering</option><option>Medical</option><option>Management</option><option>Law</option><option>University</option></select><select id="state" class="field"><option value="">All states</option><option>Delhi</option><option>Tamil Nadu</option><option>Maharashtra</option><option>Karnataka</option><option>Uttar Pradesh</option><option>West Bengal</option><option>Gujarat</option><option>Telangana</option></select><input id="maxFees" class="field" type="number" placeholder="Max annual fees ₹"><button class="btn" onclick="render()">Apply Filters</button></aside><div><div id="results"></div></div></div></section><footer>© 2026 UniPath</footer><script src="data.js"></script><script>
const params=new URLSearchParams(location.search);document.getElementById('q').value=params.get('q')||'';
function render(){let q=document.getElementById('q').value.toLowerCase(),c=document.getElementById('category').value,s=document.getElementById('state').value,m=+document.getElementById('maxFees').value||Infinity;let a=colleges.filter(x=>(!q||(x.name+' '+x.courses.join(' ')+' '+x.city).toLowerCase().includes(q))&&(!c||x.category==c)&&(!s||x.state==s)&&x.fees<=m);document.getElementById('results').innerHTML='<p><b>'+a.length+'</b> colleges found</p>'+a.map(x=>`<div class="result panel"><div><span class="rank">#${x.rank}</span><h2>${x.name}</h2><p>${x.category} · ${x.city}, ${x.state}</p><p>Fees: ₹${x.fees.toLocaleString()} · Exam: ${x.exam} · Hostel: ${x.hostel}</p></div><div><button class="btn secondary" onclick="compare(${x.id})">Compare</button> <a class="btn" href="college.html?id=${x.id}">View Details</a></div></div>`).join('')||'<div class="panel"><h3>No matches</h3><p>Try removing a filter. The colleges are hiding, not plotting against you.</p></div>'}function compare(id){let a=JSON.parse(localStorage.getItem('compare')||'[]');if(!a.includes(id))a.push(id);localStorage.setItem('compare',JSON.stringify(a));location.href='compare.html'}render();
</script></body></html>
