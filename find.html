<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Find My College | UniPath</title><link rel="stylesheet" href="style.css"><link rel="icon" href="favicon.svg"></head><body><div id="site-nav"></div><main class="page"><div class="container"><div class="page-title"><div class="eyebrow">PERSONALIZED MATCHING</div><h1>Find My College</h1><p>Answer a few practical questions. UniPath scores the full 906-institution database using the information in your free-tier dataset.</p></div><div class="quiz-v2"><section id="quizCard" class="quiz-v2-card"><div class="progress-v2"><div id="progress" style="width:0%"></div></div><div style="display:flex;justify-content:space-between;gap:10px"><span id="stepLabel" class="quiz-step"></span><span id="savedLabel" class="muted"></span></div><div id="questionBox"></div></section><div id="results" style="display:none;margin-top:16px"></div></div></div></main><div id="site-footer"></div><script src="data.js"></script><script src="app.js"></script><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const qs=[
{key:'field',title:'What broad area do you want to study?',help:'Choose the closest fit.',options:[['Engineering & Technology','engineering'],['Computer & Data','computer'],['Medicine & Health','medical'],['Science & Research','science'],['Business & Management','business'],['Law','law'],['Architecture & Design','design'],['Agriculture','agriculture'],['Arts & Commerce','arts'],['Not sure','any']]},
{key:'program',title:'Which programme are you considering?',help:'Matched against programme names in your dataset.',options:[['B.Tech / B.E.','tech'],['B.Sc / B.S.','science'],['Health programmes','health'],['Management / BBA','management'],['Law','law'],['Architecture / Design','design'],['BA / B.Com','arts'],['Agriculture','agri'],['Any programme','any']]},
{key:'exam',title:'Which entrance route fits you?',help:'We search admission and entrance text from every record.',options:[['JEE','jee'],['NEET','neet'],['CUET','cuet'],['CLAT','clat'],['NATA','nata'],['CAT','cat'],['Not sure','any']]},
{key:'budget',title:'How important is keeping fees lower?',help:'Fee matching is approximate because the source stores fee text.',options:[['Very important','low'],['Somewhat important','mid'],['Not a main concern','high'],['Not sure','any']]},
{key:'mode',title:'What study mode do you prefer?',help:'Uses the programme mode field and hostel information.',options:[['Residential / on-campus','res'],['Online / ODL','online'],['Flexible','any']]},
{key:'duration',title:'What course length do you prefer?',help:'Matched to the supplied duration text.',options:[['About 3 years','3'],['About 4 years','4'],['5+ years','5'],['No preference','any']]},
{key:'priority',title:'What should matter most?',help:'This changes the weighting of the final score.',options:[['Course match','course'],['Entrance match','exam'],['Lower fees','cost'],['Balanced','balanced']]},
{key:'category',title:'Which college type should we prioritize?',help:'This can narrow results before scoring.',options:[['Any category','any'],['Engineering','Engineering'],['Universities','Universities'],['Colleges','Colleges'],['Medical','Medical'],['Management','Management'],['Law','Law'],['Research Institutions','Research Institutions']]}
];let step=0,ans={};
function allText(c){return[c.name,c.category,c.exam,c.hostel?'hostel':'',...(c.programs||[]).flatMap(p=>Object.values(p))].join(' ').toLowerCase()}
const fieldMap={engineering:['engineering','technology','technical'],computer:['computer','data science','software','information technology','cse','electronic'],medical:['medical','medicine','mbbs','bds','nursing','health','pharmacy'],science:['science','research','physics','chemistry','biology','mathematics'],business:['management','business','bba','bms','commerce','finance'],law:['law','ll.b','llb'],design:['architecture','design','b.arch','planning'],agriculture:['agriculture','forestry','horticulture','veterinary','allied'],arts:['arts','humanities','history','journalism','commerce','liberal arts']};
const pMap={tech:['b.tech','b.e.','engineering'],science:['b.sc','b.s.','bs'],health:['mbbs','bds','nursing','b.pharm','pharmd','bpt','health','medical'],management:['bba','bms','management','b.com'],law:['law','ll.b','llb'],design:['b.arch','b.des','design'],arts:['b.a.','ba ','b.com','b.com.'],agri:['agriculture','forestry','b.v.sc']};
function score(c){const text=allText(c),ps=c.programs||[];let s=0,max=0,reasons=[];const add=(w,ok,r)=>{max+=w;if(ok){s+=w;if(r)reasons.push(r)}};let f=ans.field;add(22,f==='any'||(fieldMap[f]||[]).some(k=>text.includes(k)),'Study area match');let p=ans.program;add(24,p==='any'||(pMap[p]||[]).some(k=>text.includes(k)),'Programme match');let e=ans.exam;add(20,e==='any'||text.includes(e),'Entrance route match');let b=ans.budget;let nums=ps.flatMap(x=>[...String(x.fees||'').matchAll(/(\d+(?:\.\d+)?)\s*(lakh|lac)/ig)].map(m=>parseFloat(m[1])*100000));let bok=b==='any'||b==='high'||!nums.length||(b==='mid'?Math.min(...nums)<=1500000:Math.min(...nums)<=700000);add(10,bok,'Fee preference compatible');let m=ans.mode;let mok=m==='any'||(m==='res'?(ps.some(x=>/residential|on-campus/i.test(x.mode||''))||c.hostel):ps.some(x=>/online|odl|distance|hybrid/i.test(x.mode||'')));add(10,mok,'Study mode available');let d=ans.duration;add(6,d==='any'||ps.some(x=>String(x.duration||'').includes(d)),'Duration match');let cat=ans.category;add(8,cat==='any'||c.category===cat,'Category match');if(ans.priority==='course')s*=1.1;if(ans.priority==='exam')s*=1.09;if(ans.priority==='cost')s*=1.07;return {c,s,pct:Math.round(Math.min(98,s/(max*1.1)*100)),reasons:[...new Set(reasons)]}}
function draw(){const q=qs[step];document.getElementById('stepLabel').textContent=`Question ${step+1} of ${qs.length}`;document.getElementById('savedLabel').textContent=`${Object.keys(ans).length} saved`;document.getElementById('progress').style.width=(step/qs.length*100)+'%';document.getElementById('questionBox').innerHTML=`<h2 style="font-size:30px;margin:14px 0 6px;color:#092f67">${esc(q.title)}</h2><p class="muted">${esc(q.help)}</p><div class="question-options">${q.options.map(o=>`<button class="q-option ${ans[q.key]===o[1]?'selected':''}" onclick="choose('${q.key}','${o[1]}')">${esc(o[0])}</button>`).join('')}</div><div class="quiz-footer-v2"><button class="btn outline" onclick="back()" ${step===0?'disabled':''}>← Back</button><button class="btn" onclick="next()" ${ans[q.key]?'':'disabled'}>${step===qs.length-1?'Find My Matches':'Next →'}</button></div>`}
function choose(k,v){ans[k]=v;draw()}function back(){if(step>0){step--;draw()}}
function next(){if(!ans[qs[step].key])return;if(step<qs.length-1){step++;draw()}else finish()}
function finish(){const ranked=COLLEGES.map(score).sort((a,b)=>b.s-a.s).slice(0,15);localStorage.setItem('unipathMatches',JSON.stringify(ranked.map(x=>x.c.id)));document.getElementById('progress').style.width='100%';document.getElementById('quizCard').style.display='none';document.getElementById('results').style.display='block';document.getElementById('results').innerHTML=`<section class="panel"><div class="eyebrow">YOUR MATCHES</div><h2>${ranked.length} strongest matches from ${COLLEGES.length.toLocaleString('en-IN')} institutions</h2><p class="muted">Matches are recommendations, not admission guarantees. Open a profile to review the source information.</p><div class="match-grid">${ranked.map(x=>`<article class="match-card-v2"><div class="match-pct-v2">${x.pct}%</div><h3 style="margin:3px 0 4px">${esc(x.c.name)}</h3><div class="match-meta">${esc(x.c.category)} · ${x.c.programs.length} programme entries</div><div class="match-reasons-v2">${x.reasons.slice(0,4).map(r=>`<span>✓ ${esc(r)}</span>`).join('')}</div><a class="btn small" href="college.html?id=${encodeURIComponent(x.c.id)}">View Details</a> <button class="btn small outline" onclick="saveTarget('${x.c.id}')">Save</button></article>`).join('')}</div><div style="margin-top:17px"><button class="btn outline" onclick="restart()">Retake Quiz</button> <a class="btn" href="colleges.html">Browse All Colleges</a></div></section>`}
function saveTarget(id){let a=JSON.parse(localStorage.getItem('unipathMatches')||'[]');if(!a.includes(id))a.push(id);localStorage.setItem('unipathMatches',JSON.stringify(a));alert('Saved to your UniPath shortlist.')}
function restart(){step=0;ans={};document.getElementById('quizCard').style.display='block';document.getElementById('results').style.display='none';draw()};draw();
</script></body></html>
