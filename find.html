<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Find My College | UniPath</title><link rel="stylesheet" href="style.css"></head><body><div id="site-nav"></div><main class="page"><div class="container"><div class="page-title"><div class="eyebrow">PERSONALIZED MATCHING</div><h1>Find My College</h1><p>Answer seven practical questions. UniPath scores the full imported database and explains why each result matches.</p></div><div class="quiz panel"><div class="progress"><div id="bar" style="width:14%"></div></div><div id="qbox"></div></div></div></main><div id="site-footer"></div><script src="data.js"></script><script src="app.js"></script><script>const qs=[['What do you want to study?',['Engineering','Management','Medical','Law','Pharmacy','Architecture and Planning','Any field'],'category'],['Which entrance route are you planning to use?',['JEE Main','JEE Advanced','NEET UG','CAT','CLAT','NATA','Any route'],'exam'],['What matters most for your shortlist?',['Course fit','NIRF ranking','Lower fees','Entrance route','Any of these'],'priority'],['What fee range should we prioritize?',['Under ₹2 lakh','₹2–5 lakh','₹5–10 lakh','Above ₹10 lakh','Any fee'],'fees'],['How do you want to study?',['Residential','On-campus','Online','Any mode'],'mode'],['Which location should we prefer when the database contains it?',['Tamil Nadu','Karnataka','Maharashtra','Delhi','Uttar Pradesh','Any location'],'state'],['How important is hostel availability?',['Must have','Preferred','Not important'],'hostel']];let i=0,a={};function draw(){bar.style.width=((i+1)/qs.length*100)+'%';const q=qs[i];qbox.innerHTML=`<h2>${q[0]}</h2><p class="muted">Question ${i+1} of ${qs.length}</p><div class="option-grid">${q[1].map(x=>`<button class="option" onclick="pick(${JSON.stringify(x)})">${x}</button>`).join('')}</div>`}function pick(x){a[qs[i][2]]=x;if(i<qs.length-1){i++;draw()}else finish()}function score(c){let s=0,why=[];const text=c.search||'';if(a.category&&a.category!=='Any field'){if(c.category===a.category){s+=30;why.push('category match')}}if(a.exam&&a.exam!=='Any route'){if(c.programmes.some(p=>(p.entrance||'').toLowerCase().includes(a.exam.toLowerCase()))){s+=25;why.push('entrance route match')}}if(a.state&&a.state!=='Any location'){if(c.state===a.state){s+=12;why.push('location match')}}if(a.mode&&a.mode!=='Any mode'){if(c.programmes.some(p=>(p.mode||'').toLowerCase().includes(a.mode.toLowerCase()))){s+=10;why.push('study mode match')}}if(a.fees&&a.fees!=='Any fee'){const f=c.minFee;if(f!=null){const ok=a.fees==='Under ₹2 lakh'?f<200000:a.fees==='₹2–5 lakh'?f<=500000:a.fees==='₹5–10 lakh'?f<=1000000:true;if(ok){s+=12;why.push('fee fit')}}}if(a.hostel==='Must have'&&text.includes('hostel')){s+=6;why.push('hostel information available')}if(a.priority==='NIRF ranking'&&c.nirfRank){s+=5;why.push('verified NIRF rank')}if(a.priority==='Lower fees'&&c.minFee!=null&&c.minFee<500000){s+=5;why.push('lower listed fee')}if(a.priority==='Course fit'&&c.programmes.length){s+=5;why.push('programme data available')}return{s,why}}function finish(){const scored=COLLEGES.map(c=>({...c,match:score(c)})).filter(x=>x.match.s>0).sort((a,b)=>b.match.s-a.match.s||((a.nirfRank??999)-(b.nirfRank??999)));const top=scored.slice(0,10);localStorage.setItem('unipathMatches',JSON.stringify(top.map(c=>c.id)));bar.style.width='100%';qbox.innerHTML=`<h2>Your matches are ready 🎯</h2><p class="muted">Scored across ${COLLEGES.length.toLocaleString('en-IN')} imported records.</p><div class="card-list">${top.map(c=>`<div class="match"><div class="match-top"><div><div class="rank">${c.nirfRank?'NIRF 2025 #'+c.nirfRank:'MATCH'}</div><h2 style="margin:4px 0;color:#0a397f">${c.name}</h2><div class="meta">${c.category} · ${[c.city,c.state].filter(Boolean).join(', ')||'Location not listed'}</div><div class="meta">${c.match.why.slice(0,4).map(x=>'✓ '+x).join(' · ')||'General database match'}</div></div><div class="score">${Math.min(99,Math.max(60,c.match.s))}%</div></div><br><a class="btn small" href="college.html?id=${encodeURIComponent(c.id)}">View College</a></div>`).join('')}</div><br><a class="btn" href="dashboard.html">Save to Dashboard</a> <a class="btn outline" href="find.html">Start Again</a>`}draw()</script></body></html>
