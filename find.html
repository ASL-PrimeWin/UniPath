<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Find My College | UniPath</title><link rel="stylesheet" href="style.css"></head><body><header class="nav"><a class="brand" href="index.html">UNI<span>PATH</span><small>FIND YOUR RIGHT PATH</small></a><nav><a href="colleges.html">Colleges</a><a href="rankings.html">NIRF Rankings</a><a href="exams.html">Exams</a><a href="find.html">Find My College</a><a href="dashboard.html">Dashboard</a></nav></header><section><span class="eyebrow">PERSONALIZED MATCH</span><h1>Find My College</h1><p>Set your preferences and get a simple starting shortlist.</p><div class="panel form"><label>Preferred field<select id="field" class="field"><option>Engineering</option><option>Medical</option><option>Management</option><option>Law</option><option>University</option></select></label><label>Preferred state<select id="state" class="field"><option value="">Any state</option><option>Tamil Nadu</option><option>Delhi</option><option>Maharashtra</option><option>Karnataka</option><option>Telangana</option></select></label><label>Maximum annual fees<input id="fees" class="field" type="number" value="300000"></label><button class="btn" onclick="match()">Find Matches</button></div><div id="out"></div></section><footer>© 2026 UniPath</footer><script src="data.js"></script><script>function match(){let f=field.value,s=state.value,m=+fees.value;let a=colleges.filter(x=>x.category==f&&(!s||x.state==s)&&x.fees<=m).sort((a,b)=>a.rank-b.rank);out.innerHTML='<h2>Your matches</h2>'+a.map(x=>`<div class="result panel"><div><h2>${x.name}</h2><p>NIRF #${x.rank} · ${x.city}, ${x.state} · ₹${x.fees.toLocaleString()}</p></div><a class="btn" href="college.html?id=${x.id}">View</a></div>`).join('')||'<div class="panel">No exact matches. Try increasing your fee limit or widening your location.</div>'}</script></body></html>
