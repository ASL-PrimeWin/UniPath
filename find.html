<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Find My College | UniPath</title><link rel="stylesheet" href="style.css"><link rel="icon" href="favicon.png"></head><body><div id="site-nav"></div><main class="page"><div class="container"><div class="page-title"><div class="eyebrow">PERSONALIZED MATCHING</div><h1>Find My College</h1><p>Answer practical questions and UniPath will score all <strong>906 institutions</strong> using the programme and college information in your team dataset.</p></div><div class="quiz-v2"><section id="quizCard" class="quiz-v2-card"><div class="progress-v2"><div id="progress" style="width:0%"></div></div><div style="display:flex;justify-content:space-between;gap:10px"><span id="stepLabel" class="quiz-step"></span><span id="savedLabel" class="muted"></span></div><div id="questionBox"></div></section><div id="results" style="display:none;margin-top:16px"></div></div></div></main><div id="site-footer"></div><script src="data.js"></script><script src="app.js"></script><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const qs=[
{key:'field',title:'What do you want to study?',help:'Pick the broadest area that matches you.',options:[['Engineering & technology','engineering'],['Computer & data','computer'],['Medicine & health','medical'],['Science & research','science'],['Business & management','business'],['Law','law'],['Architecture & design','design'],['Agriculture','agriculture'],['Arts & commerce','arts'],['Not sure','any']]},
{key:'program',title:'Which programme type interests you?',help:'Matched against programme names and course text.',options:[['B.Tech / B.E.','tech'],['B.Sc / B.S.','science'],['Health programmes','health'],['Management / BBA','management'],['Law','law'],['Architecture / design','design'],['BA / B.Com','arts'],['Agriculture','agri'],['Any programme','any']]},
{key:'exam',title:'Which entrance route are you considering?',help:'UniPath checks entrance/admission text across every record.',options:[['JEE','jee'],['NEET','neet'],['CUET','cuet'],['CLAT','clat'],['NATA','nata'],['CAT','cat'],['Not sure','any']]},
{key:'budget',title:'How important is keeping fees lower?',help:'Fee matching is approximate because fee data is stored as text.',options:[['Very important','low'],['Somewhat important','mid'],['Not a priority','high'],['Not sure','any']]},
{key:'hostel',title:'Do you need hostel information?',help:'Uses the hostel field supplied in the team dataset.',options:[['Hostel required','yes'],['Hostel preferred','preferred'],['Not needed','no'],['No preference','any']]},
{key:'mode',title:'What study mode do you prefer?',help:'Matched against programme mode text.',options:[['Residential / on-campus','res'],['Online / distance','online'],['Flexible / hybrid','hybrid'],['No preference','any']]},
{key:'duration',title:'What course length do you prefer?',help:'Matched against supplied duration text.',options:[['About 3 years','3'],['About 4 years','4'],['5+ years','5'],['No preference','any']]},
{key:'category',title:'Which category should we prioritize?',help:'This is a soft preference, not a hard exclusion.',options:[['Any category','any'],['Engineering','Engineering'],['Universities','Universities'],['Colleges','Colleges'],['Medical','Medical'],['Management','Management'],['Law','Law'],['Research Institutions','Research Institutions'],['State Public Universities','State Public Universities']]},
{key:'priority',title:'What matters most to you?',help:'This slightly changes the weighting of the final match.',options:[['Course fit','course'],['Entrance fit','exam'],['Lower fees','cost'],['Balanced','balanced']]}
];
let step=0,ans={};
function text(c){return[c.name,c.category,c.exam,c.hostel?'hostel':'',...(c.programs||[]).flatMap(p=>Object.values(p))].join(' ').toLowerCase()}
const fieldMap={engineering:['engineering','technology','technical'],computer:['computer','data science','software','information technology','cse','electronic'],medical:['medical','medicine','mbbs','bds','nursing','health','pharmacy'],science:['science','research','physics','chemistry','biology','mathematics'],business:['management','business','bba','bms','commerce','finance'],law:['law','ll.b','llb'],design:['architecture','design','b.arch','planning'],agriculture:['agriculture','forestry','horticulture','veterinary','allied'],arts:['arts','humanities','history','journalism','commerce','liberal arts']};
const pMap={tech:['b.tech','b.e.','engineering'],science:['b.sc','b.s','bs '],health:['mbbs','bds','nursing','b.pharm','pharmd','bpt','health','medical'],management:['bba','bms','management','b.com'],law:['law','ll.b','llb'],design:['b.arch','b.des','design'],arts:['b.a.','ba ','b.com','b.com.'],agri:['agriculture','forestry','b.v.sc']};
function feeNums(c){return(c.programs||[]).flatMap(p=>[...String(p.fees||'').matchAll(/(\d+(?:\.\d+)?)\s*(?:lakh|lac|L)/ig)].map(m=>Number(m[1])*100000))}
function score(c){const t=text(c),ps=c.programs||[];let score=0,total=0,reasons=[];const add=(w,ok,label)=>{total+=w;if(ok){score+=w;reasons.push(label)}};const f=ans.field;add(22,f==='any'||(fieldMap[f]||[]).some(k=>t.includes(k)),'Study area');const p=ans.program;add(22,p==='any'||(pMap[p]||[]).some(k=>t.includes(k)),'Programme type');const e=ans.exam;add(18,e==='any'||t.includes(e),'Entrance route');const b=ans.budget;const nums=feeNums(c);const bok=b==='any'||b==='high'||!nums.length||(b==='mid'&&Math.min(...nums)<=1500000)||(b==='low'&&Math.min(...nums)<=700000);add(11,bok,'Fee preference');const h=ans.hostel;const hok=h==='any'||(h==='yes'&&c.hostel)||(h==='preferred'&&c.hostel)||(h==='no'&&!c.hostel);add(8,hok,'Hostel preference');const m=ans.mode;const mok=m==='any'||(m==='res'&&ps.some(x=>/residential|on-campus/i.test(x.mode||'')))||(m==='online'&&ps.some(x=>/online|odl|distance/i.test(x.mode||'')))||(m==='hybrid'&&ps.some(x=>/hybrid|flexible|mixed/i.test(x.mode||'')));add(7,mok,'Study mode');const d=ans.duration;add(5,d==='any'||ps.some(x=>String(x.duration||'').includes(d)),'Course length');const cat=ans.category;add(7,cat==='any'||c.category===cat,'Category');if(ans.priority==='course')score*=1.08;if(ans.priority==='exam')score*=1.08;if(ans.priority==='cost')score*=1.05;const pct=Math.round(Math.min(99,(score/(total||1))*100));return{c,score,pct,reasons:[...new Set(reasons)]}}
function draw(){const q=qs[step];document.getElementById('stepLabel').textContent=`Question ${step+1} of ${qs.length}`;document.getElementById('savedLabel').textContent=`${Object.keys(ans).length} answered`;document.getElementById('progress').style.width=(step/qs.length*100)+'%';document.getElementById('questionBox').innerHTML=`<h2 style="font-size:28px;margin:14px 0 6px;color:#092f67">${esc(q.title)}</h2><p class="muted">${esc(q.help)}</p><div class="question-options">${q.options.map(o=>`<button class="q-option ${ans[q.key]===o[1]?'selected':''}" onclick="choose('${q.key}','${o[1]}')">${esc(o[0])}</button>`).join('')}</div><div class="quiz-footer-v2"><button class="btn outline" type="button" onclick="back()" ${step===0?'disabled':''}>← Back</button><button class="btn" type="button" onclick="next()" ${ans[q.key]?'':'disabled'}>${step===qs.length-1?'Find My Matches':'Next →'}</button></div>`}
function choose(k,v){ans[k]=v;draw()}function back(){if(step>0){step--;draw()}}function next(){if(!ans[qs[step].key])return;if(step<qs.length-1){step++;draw()}else finish()}
function finish(){const ranked=COLLEGES.map(score).sort((a,b)=>b.score-a.score).slice(0,18);localStorage.setItem('unipathMatches',JSON.stringify(ranked.map(x=>x.c.id)));document.getElementById('quizCard').style.display='none';document.getElementById('results').style.display='block';document.getElementById('results').innerHTML=`<section class="panel"><div class="eyebrow">YOUR MATCHES</div><h2>${ranked.length} strongest matches from all ${COLLEGES.length} institutions</h2><p class="muted">These are recommendation scores based on the information in the UniPath dataset. They are not admission guarantees.</p><div class="match-grid">${ranked.map(x=>`<article class="match-card-v2"><div class="match-pct-v2">${x.pct}%</div><h3 style="margin:3px 0 4px">${esc(x.c.name)}</h3><div class="match-meta">${esc(x.c.category)} · ${x.c.programs.length} programme entries</div><div class="match-reasons-v2">${x.reasons.slice(0,4).map(r=>`<span>✓ ${esc(r)}</span>`).join('')}</div><a class="btn small" href="college.html?id=${encodeURIComponent(x.c.id)}">View Details</a><button class="btn small outline" type="button" onclick="saveTarget('${esc(x.c.id)}')">Save</button></article>`).join('')}</div><div style="margin-top:17px"><button class="btn outline" type="button" onclick="restart()">Retake Quiz</button> <a class="btn" href="colleges.html">Browse All Colleges</a></div></section>`}
function saveTarget(id){let a=JSON.parse(localStorage.getItem('unipathMatches')||'[]');if(!a.includes(id))a.push(id);localStorage.setItem('unipathMatches',JSON.stringify(a));alert('Saved to your UniPath shortlist.')}
function restart(){step=0;ans={};document.getElementById('quizCard').style.display='block';document.getElementById('results').style.display='none';draw()}
draw();
</script></body></html>
