<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Find My College | UniPath</title><link rel="stylesheet" href="style.css"><link rel="icon" href="favicon.svg"></head><body><div id="site-nav"></div><main class="page"><div class="container"><div class="page-title"><div class="eyebrow">PERSONALIZE</div><h1>Find My College</h1><p>Answer four questions for a simple demo shortlist.</p></div><div class="quiz panel"><div class="progress"><div id="bar" style="width:25%"></div></div><div id="qbox"></div></div></div></main><div id="site-footer"></div><script src="data.js"></script><script src="app.js"></script><script>const qs=[['What are you interested in?',['Engineering','Management','Medical','Law'],'category'],['Preferred region?',['Tamil Nadu','Karnataka','Delhi','Maharashtra'],'state'],['Annual fee range?',['Under ₹2 lakh','₹2–5 lakh','Above ₹5 lakh'],'fees'],['Is hostel important?',['Important','Nice to have'],'hostel']];let i=0,a={};function draw(){document.getElementById('bar').style.width=((i+1)/4*100)+'%';let q=qs[i];document.getElementById('qbox').innerHTML=`<h2>${q[0]}</h2><div class="option-grid">${q[1].map(x=>`<button class="option" onclick="pick(${JSON.stringify(x)})">${x}</button>`).join('')}</div>`}function pick(x){a[qs[i][2]]=x;if(i<3){i++;draw()}else finish()}function finish(){let l=COLLEGES.filter(c=>(!a.category||c.category===a.category)&&(!a.state||c.state===a.state)&&(!a.fees||(a.fees==='Under ₹2 lakh'?c.fees<200000:a.fees==='₹2–5 lakh'?c.fees<=500000:true))&&(!a.hostel||a.hostel!=='Important'||c.hostel));if(!l.length)l=COLLEGES.slice(0,4);localStorage.setItem('unipathMatches',JSON.stringify(l.map(c=>c.id)));document.getElementById('bar').style.width='100%';document.getElementById('qbox').innerHTML=`<h2>Your matches are ready 🎯</h2><p class="muted">${l.length} demo colleges matched your answers.</p><div class="card-list">${l.slice(0,5).map(c=>`<div class="college-card"><div><div class="rank">MATCH</div><h2>${c.name}</h2><div class="meta">${c.category} · ${c.city}, ${c.state}</div></div><a class="btn small" href="college.html?id=${c.id}">View</a></div>`).join('')}</div><br><a class="btn" href="dashboard.html">Open Dashboard</a>`}draw();</script></body></html>
