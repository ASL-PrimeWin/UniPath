<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Find My College | UniPath</title><link rel="stylesheet" href="style.css"><link rel="icon" href="favicon.svg"></head><body><div id="site-nav"></div>
<main class="page"><div class="container"><div class="page-title"><div class="eyebrow">PERSONALIZE</div><h1>Find My College</h1><p>Use the free dataset to build a simple category and programme-based shortlist.</p></div><div class="quiz panel"><div class="progress"><div id="bar" style="width:25%"></div></div><div id="qbox"></div></div></div></main><div id="site-footer"></div><script src="data.js"></script><script src="app.js"></script>
<script>
const cats=[...new Set(COLLEGES.map(c=>c.category))].sort();
const qs=[['What area are you interested in?',cats,'category'],['Which programme type fits you?',['B.Tech','B.Sc','B.A','B.Com','BBA','BCA','MBBS','BDS','B.Pharm','Law','B.Arch','MBA'],'program'],['Do you care about residential study?', ['Yes','No'],'hostel'],['Any entrance exam keyword?', ['JEE','NEET','CUET','CAT','CLAT','NATA','Any'],'exam']];
let i=0,a={};
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function draw(){document.getElementById('bar').style.width=((i+1)/4*100)+'%';let q=qs[i];document.getElementById('qbox').innerHTML=`<h2>${esc(q[0])}</h2><div class="option-grid">${q[1].map(x=>`<button class="option" onclick="pick(${JSON.stringify(x)})">${esc(x)}</button>`).join('')}</div>`}
function pick(x){a[qs[i][2]]=x;if(i<3){i++;draw()}else finish()}
function finish(){
 let l=COLLEGES.filter(c=>{
  const prog=c.programs.map(p=>p.programme).join(' ').toLowerCase(), entrances=c.programs.map(p=>p.entrance).join(' ').toLowerCase();
  return (!a.category||c.category===a.category)&&(!a.program||prog.includes(a.program.toLowerCase()))&&(!a.hostel||a.hostel!=='Yes'||c.hostel)&&(!a.exam||a.exam==='Any'||entrances.includes(a.exam.toLowerCase()));
 });
 if(!l.length)l=COLLEGES.filter(c=>a.category?c.category===a.category:true).slice(0,8);
 localStorage.setItem('unipathMatches',JSON.stringify(l.slice(0,20).map(c=>c.id)));
 document.getElementById('bar').style.width='100%';document.getElementById('qbox').innerHTML=`<h2>Your matches are ready 🎯</h2><p class="muted">${l.length} institution records matched the free-tier dataset.</p><div class="card-list">${l.slice(0,8).map(c=>`<div class="college-card"><div><div class="rank">${esc(c.category)}</div><h2>${esc(c.name)}</h2><div class="meta">${c.programs.length} programme entries</div></div><a class="btn small" href="college.html?id=${encodeURIComponent(c.id)}">View</a></div>`).join('')}</div><br><a class="btn" href="dashboard.html">Open Dashboard</a>`;
}
draw();
</script></body></html>
