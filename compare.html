<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Compare Colleges | UniPath</title><link rel="stylesheet" href="style.css?v=20260912"></head><body><div id="site-nav"></div><main class="page"><div class="container"><div class="page-title"><div class="eyebrow">FREE TOOL</div><h1>Compare Colleges</h1><p>Choose up to two colleges from Search.</p></div><div id="box"></div></div></main><div id="site-footer"></div><script src="data.js?v=20260912"></script><script src="app.js?v=20260912"></script><script>const ids=JSON.parse(localStorage.getItem('unipathCompare')||'[]');const cs=ids.map(getCollege).filter(Boolean);box.innerHTML=cs.length?`<div class="compare-grid">${cs.map(c=>`<div class="compare-item"><div class="rank">${c.nirfRank?'NIRF 2025 #'+c.nirfRank:'Rank not imported'}</div><h2 style="color:#0a397f">${c.name}</h2><div class="info-row"><span>Category</span><strong>${c.category}</strong></div><div class="info-row"><span>Location</span><strong>${[c.city,c.state].filter(Boolean).join(', ')||'Not listed'}</strong></div><div class="info-row"><span>Lowest fee</span><strong>${money(c.minFee)}</strong></div><div class="info-row"><span>Programmes</span><strong>${c.programmes.length}</strong></div><a class="btn" href="college.html?id=${encodeURIComponent(c.id)}">View Details</a></div>`).join('')}</div>`:'<div class="empty"><h2>Add colleges to compare</h2><a class="btn" href="colleges.html">Search Colleges</a></div>'</script></body></html>
