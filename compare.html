<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Compare Colleges | UniPath</title><link rel="stylesheet" href="style.css"></head><body><header class="nav"><a class="brand" href="index.html">UNI<span>PATH</span><small>FIND YOUR RIGHT PATH</small></a><nav><a href="colleges.html">Colleges</a><a href="rankings.html">NIRF Rankings</a><a href="exams.html">Exams</a><a href="find.html">Find My College</a><a href="dashboard.html">Dashboard</a></nav></header><section><span class="eyebrow">DECIDE</span><h1>Compare Colleges</h1><p>Choose colleges from search to build your comparison.</p><div id="table" class="panel" style="overflow:auto;margin-top:30px"></div><a class="btn secondary" href="colleges.html">Add More Colleges</a></section><footer>© 2026 UniPath</footer><script src="data.js"></script><script>let ids=JSON.parse(localStorage.getItem('compare')||'[]');let a=ids.map(id=>colleges.find(x=>x.id==id)).filter(Boolean);if(!a.length)a=colleges.slice(0,2);document.getElementById('table').innerHTML='<table><tr><th>Attribute</th>'+a.map(x=>'<th>'+x.name+'</th>').join('')+'</tr>'+[['NIRF Rank',x=>'#'+x.rank],['Category',x=>x.category],['Location',x=>x.city+', '+x.state],['Fees',x=>'₹'+x.fees.toLocaleString()],['Entrance',x=>x.exam],['Hostel',x=>x.hostel]].map(r=>'<tr><td><b>'+r[0]+'</b></td>'+a.map(x=>'<td>'+r[1](x)+'</td>').join('')+'</tr>').join('')+'</table>'</script></body></html>
