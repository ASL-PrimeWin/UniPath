<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Compare Colleges | UniPath</title><link rel="stylesheet" href="style.css"><link rel="icon" href="favicon.svg"></head><body><div id="site-nav"></div><main class="page"><div class="container"><div class="page-title"><div class="eyebrow">DECIDE</div><h1>Compare Colleges</h1><p>Compare two colleges saved from College Search.</p></div><div id="compare"></div></div></main><div id="site-footer"></div><script src="data.js"></script><script src="app.js"></script><script>function draw(){let ids=JSON.parse(localStorage.getItem('unipathCompare')||'[]'),l=ids.map(getCollege).filter(Boolean),box=document.getElementById('compare');if(l.length<2){box.innerHTML='<div class="empty"><h2>Select two colleges</h2><p>Use Compare on the College Search page.</p><a class="btn" href="colleges.html">Find Colleges</a></div>';return}box.innerHTML=`<div class="compare-grid">${l.map(c=>`<div class="compare-item"><div class="rank">NIRF #${c.rank}</div><h2>${c.name}</h2><div class="info-row"><span>Category</span><strong>${c.category}</strong></div><div class="info-row"><span>Location</span><strong>${c.city}, ${c.state}</strong></div><div class="info-row"><span>Annual fee</span><strong>${money(c.fees)}</strong></div><div class="info-row"><span>Exam</span><strong>${c.exam}</strong></div><div class="info-row"><span>Hostel</span><strong>${c.hostel?'Yes':'Check'}</strong></div></div>`).join('')}</div><br><button class="btn outline" onclick="localStorage.removeItem('unipathCompare');draw()">Clear Comparison</button>`}draw();</script></body></html>
