<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Compare Colleges | UniPath</title><link rel="stylesheet" href="style.css"><link rel="icon" href="favicon.png"></head><body><div id="site-nav"></div><main class="page"><div class="container"><div class="page-title"><div class="eyebrow">DECIDE</div><h1>Compare Colleges</h1><p>Compare two colleges side by side using the same free-tier records used by Search.</p></div><div id="compare"></div></div></main><div id="site-footer"></div><script src="data.js"></script><script src="app.js"></script><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function render(){const ids=JSON.parse(localStorage.getItem('unipathCompare')||'[]'),list=ids.map(getCollege).filter(Boolean),box=document.getElementById('compare');if(list.length<2){box.innerHTML='<div class="empty"><h2>Select two colleges</h2><p>Choose Compare from College Search or a college profile.</p><a class="btn" href="colleges.html">Find Colleges</a></div>';return}const rows=[['Category',c=>c.category],['Programme entries',c=>c.programs.length],['Hostel',c=>c.hostel?'Listed':'Not listed'],['Entrance examples',c=>[...new Set(c.programs.map(p=>p.entrance).filter(Boolean))].slice(0,2).join(' · ')||'—'],['Fee examples',c=>[...new Set(c.programs.map(p=>p.fees).filter(Boolean))].slice(0,2).join(' · ')||'—'],['Modes',c=>[...new Set(c.programs.map(p=>p.mode).filter(Boolean))].slice(0,2).join(' · ')||'—']];box.innerHTML=`<section class="panel"><div class="table-wrap"><table><thead><tr><th>Measure</th>${list.map(c=>`<th>${esc(c.name)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr><td><strong>${esc(r[0])}</strong></td>${list.map(c=>`<td>${esc(String(r[1](c)))}</td>`).join('')}</tr>`).join('')}</tbody></table></div></section><div style="margin-top:14px"><button class="btn outline" onclick="localStorage.removeItem('unipathCompare');render()">Clear comparison</button></div>`}render();
</script></body></html>
