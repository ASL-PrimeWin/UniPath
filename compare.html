<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Compare Colleges | UniPath</title><link rel="stylesheet" href="style.css"><link rel="icon" href="favicon.svg"></head><body><div id="site-nav"></div>
<main class="page"><div class="container"><div class="page-title"><div class="eyebrow">DECIDE</div><h1>Compare Colleges</h1><p>Compare two institution records from the free-tier dataset.</p></div><div id="compare"></div></div></main><div id="site-footer"></div><script src="data.js"></script><script src="app.js"></script>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function draw(){let ids=JSON.parse(localStorage.getItem('unipathCompare')||'[]'),l=ids.map(getCollege).filter(Boolean),box=document.getElementById('compare');
if(l.length<2){box.innerHTML='<div class="empty"><h2>Select two institutions</h2><p>Use Compare from College Search or a college profile.</p><a class="btn" href="colleges.html">Find Colleges</a></div>';return}
box.innerHTML=`<div class="compare-grid">${l.map(c=>`<div class="compare-item"><div class="rank">${esc(c.category)}</div><h2>${esc(c.name)}</h2><div class="info-row"><span>Category</span><strong>${esc(c.category)}</strong></div><div class="info-row"><span>Programme entries</span><strong>${c.programs.length}</strong></div><div class="info-row"><span>Entrance examples</span><strong>${esc([...new Set(c.programs.map(p=>p.entrance).filter(Boolean))].slice(0,3).join(' · ')||'See profile')}</strong></div><div class="info-row"><span>Fee examples</span><strong>${esc([...new Set(c.programs.map(p=>p.fees).filter(Boolean))].slice(0,3).join(' · ')||'See profile')}</strong></div><div class="info-row"><span>Mode</span><strong>${c.hostel?'Residential listed':'Varies'}</strong></div><a class="btn small" href="college.html?id=${encodeURIComponent(c.id)}">Full Details</a></div>`).join('')}</div><br><button class="btn outline" onclick="localStorage.removeItem('unipathCompare');draw()">Clear Comparison</button>`}
draw();
</script></body></html>
