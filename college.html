<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>College Profile | UniPath</title><link rel="stylesheet" href="style.css"></head><body><div id="site-nav"></div><main class="page"><div class="container" id="content"></div></main><div id="site-footer"></div><script src="data.js"></script><script src="app.js"></script><script>const c=getCollege(new URLSearchParams(location.search).get('id'));function esc(s){return String(s||'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\\':'&#92;'}[m]))}if(!c){content.innerHTML=`<div class="empty"><h2>College not found</h2><a class="btn" href="colleges.html">Back to Search</a></div>`}else{const loc=[c.city,c.state].filter(Boolean).join(', ')||'Location not listed in team CSV';content.innerHTML=`<div class="muted" style="margin-bottom:10px">Home › Colleges › ${esc(c.name)}</div><section class="detail-hero"><div class="detail-copy"><div class="eyebrow">COLLEGE PROFILE</div><h1>${esc(c.name)}</h1><p>${esc(c.category)} · ${esc(loc)}</p><span class="tag">${c.nirfRank?'NIRF 2025 #'+c.nirfRank:'NIRF rank not imported'}</span><span class="tag">${c.programmes.length} programme entries</span></div><div class="detail-image"></div></section><div class="detail-grid"><div class="info-card"><h3>Overview</h3><div class="info-row"><span>Category</span><strong>${esc(c.category)}</strong></div><div class="info-row"><span>Location</span><strong>${esc(loc)}</strong></div><div class="info-row"><span>NIRF 2025</span><strong>${c.nirfRank?'#'+c.nirfRank:'Not imported'}</strong></div><div class="info-row"><span>Lowest listed fee</span><strong>${money(c.minFee)}</strong></div></div><div class="info-card"><h3>About this image</h3><p class="muted">Illustrative campus image used for the UniPath profile layout. It is not presented as a verified photograph of this institution.</p><button class="btn outline" onclick="addCompare()">Add to Compare</button> <a class="btn" href="colleges.html">Back to Search</a></div></div><br><div class="table-wrap"><table><thead><tr><th>Programme</th><th>Courses offered</th><th>Eligibility</th><th>Entrance / Admission</th><th>Mode</th><th>Duration</th><th>Fees</th></tr></thead><tbody>${c.programmes.map(p=>`<tr><td><strong>${esc(p.programme)}</strong></td><td>${esc(p.courses)}</td><td>${esc(p.eligibility)}</td><td>${esc(p.entrance)}</td><td>${esc(p.mode)}</td><td>${esc(p.duration)}</td><td>${esc(p.fees)}</td></tr>`).join('')}</tbody></table></div><br><div class="notice">Programme and fee information comes from the team-provided UniPath free-tier CSV. Verify current official admission details before applying.</div>`}function addCompare(){let a=JSON.parse(localStorage.getItem('unipathCompare')||'[]');if(!a.includes(c.id))a.push(c.id);a=a.slice(-2);localStorage.setItem('unipathCompare',JSON.stringify(a));location.href='compare.html'}</script></body></html>
