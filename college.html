<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>College Details | UniPath</title><link rel="stylesheet" href="style.css"></head><body><header class="nav"><a class="brand" href="index.html">UNI<span>PATH</span><small>FIND YOUR RIGHT PATH</small></a><nav><a href="colleges.html">Colleges</a><a href="rankings.html">NIRF Rankings</a><a href="exams.html">Exams</a><a href="find.html">Find My College</a><a href="dashboard.html">Dashboard</a></nav></header><section id="app"></section><footer>© 2026 UniPath</footer><script src="data.js"></script><script>
const id=+(new URLSearchParams(location.search).get('id')||1),c=colleges.find(x=>x.id===id)||colleges[0];document.getElementById('app').innerHTML=`<span class="eyebrow">${c.category.toUpperCase()}</span><h1>${c.name}</h1><p>${c.city}, ${c.state} · ${c.type} institution</p><div class="cards"><div class="panel"><span class="eyebrow">NIRF RANK</span><h2>#${c.rank}</h2></div><div class="panel"><span class="eyebrow">ANNUAL FEES</span><h2>₹${c.fees.toLocaleString()}</h2></div><div class="panel"><span class="eyebrow">ENTRANCE</span><h2>${c.exam}</h2></div></div><div class="panel"><h2>Popular Courses</h2><div class="tags">${c.courses.map(x=>'<span>'+x+'</span>').join('')}</div><hr><p><b>Hostel:</b> ${c.hostel}</p><p><b>Location:</b> ${c.city}, ${c.state}</p><button class="btn" onclick="save()">Add to My Plan</button></div>`;function save(){let a=JSON.parse(localStorage.getItem('saved')||'[]');if(!a.includes(c.id))a.push(c.id);localStorage.setItem('saved',JSON.stringify(a));alert('Added to your plan!')}
</script></body></html>
