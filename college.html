<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>College Details | UniPath</title><link rel="stylesheet" href="style.css"><link rel="icon" href="favicon.svg"></head><body><div id="site-nav"></div><main class="page"><div class="container" id="content"></div></main><div id="site-footer"></div><script src="data.js"></script><script src="app.js"></script><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const c=getCollege(new URLSearchParams(location.search).get('id')||'iit-madras-ug-programmes');
if(!c){document.getElementById('content').innerHTML='<div class="empty"><h2>Institution not found</h2><a class="btn" href="colleges.html">Back to Search</a></div>'}else{const rank=lookupNirfRank(c.category,c.name);const table=(c.programs||[]).map(p=>`<tr><td><strong>${esc(p.programme||'—')}</strong></td><td>${esc(p.courses||'—')}</td><td>${esc(p.eligibility||'—')}</td><td>${esc(p.entrance||'—')}</td><td>${esc(p.mode||'—')}</td><td>${esc(p.duration||'—')}</td><td>${esc(p.fees||'—')}</td></tr>`).join('');document.getElementById('content').innerHTML=`<section class="detail-hero-v2"><div class="eyebrow" style="color:#7db3ff">UNIPATH COLLEGE PROFILE</div><h1>${esc(c.name)}</h1><p>${esc(c.category)} · ${c.programs.length} programme entries</p>${rank?`<div style="display:inline-flex;margin-top:12px;padding:7px 10px;border-radius:999px;background:rgba(255,255,255,.11);font-weight:900">NIRF 2025: #${rank}</div>`:''}</section><div class="detail-grid-v2"><section class="info-card-v2"><div class="eyebrow">SUMMARY</div><h2 style="margin:6px 0;color:#0a376f">About this record</h2><div class="info-row"><span>Category</span><strong>${esc(c.category)}</strong></div><div class="info-row"><span>Programme entries</span><strong>${c.programs.length}</strong></div><div class="info-row"><span>Main entrance route</span><strong>${esc(c.exam||'See programme table')}</strong></div><div class="info-row"><span>Hostel</span><strong>${c.hostel?'Listed':'Not listed'}</strong></div></section><section class="info-card-v2"><div class="eyebrow">ACTIONS</div><h2 style="margin:6px 0;color:#0a376f">Plan with this college</h2><p class="muted">Save it, compare it, or add it to your plan.</p><button class="btn small" onclick="addCompare('${c.id}')">Add to Compare</button> <button class="btn small outline" onclick="saveTier('${c.id}','dream')">Save Dream</button> <a class="btn small outline" href="colleges.html">Back to Search</a></section></div><section class="panel" style="margin-top:17px"><div class="eyebrow">FREE-TIER DATA</div><h2 style="margin:6px 0 16px;color:#0a376f">Programmes & admission information</h2><div class="table-wrap"><table><thead><tr><th>Programme</th><th>Courses offered</th><th>Eligibility</th><th>Entrance / Admission</th><th>Mode</th><th>Duration</th><th>Fees</th></tr></thead><tbody>${table}</tbody></table></div></section><div class="notice">The programme, eligibility, entrance, mode, duration and fee text above comes from the UniPath team free-tier dataset. Check the institution's current official information before applying.</div>`}
function addCompare(id){let a=JSON.parse(localStorage.getItem('unipathCompare')||'[]');if(!a.includes(id))a.push(id);if(a.length>2)a=a.slice(-2);localStorage.setItem('unipathCompare',JSON.stringify(a));location.href='compare.html'}function saveTier(id,tier){let a=JSON.parse(localStorage.getItem('unipathMatches')||'[]');if(!a.includes(id))a.push(id);localStorage.setItem('unipathMatches',JSON.stringify(a));let t=JSON.parse(localStorage.getItem('unipathTiers')||'{}');t[id]=tier;localStorage.setItem('unipathTiers',JSON.stringify(t));alert('Saved to your '+tier+' list.')}
</script></body></html>
