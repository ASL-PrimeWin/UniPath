<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>College Details | UniPath</title><link rel="stylesheet" href="style.css"><link rel="icon" href="favicon.svg"></head><body><div id="site-nav"></div><main class="page"><div class="container" id="content"></div></main><div id="site-footer"></div><script src="data.js"></script><script src="app.js"></script><script>let c=getCollege(new URLSearchParams(location.search).get('id')||'iit-madras');document.getElementById('content').innerHTML=c?`<div class="detail-hero"><div class="eyebrow">COLLEGE PROFILE</div><h1>${c.name}</h1><p>${c.category} · ${c.city}, ${c.state}</p><span class="tag">NIRF #${c.rank}</span></div><div class="detail-grid"><div class="info-card"><h3>Quick Facts</h3><div class="info-row"><span>NIRF Rank</span><strong>#${c.rank}</strong></div><div class="info-row"><span>Annual fee</span><strong>${money(c.fees)}</strong></div><div class="info-row"><span>Entrance exam</span><strong>${c.exam}</strong></div><div class="info-row"><span>Hostel</span><strong>${c.hostel?'Available':'Check'}</strong></div></div><div class="info-card"><h3>Popular Courses</h3>${c.courses.map(x=>`<p class="meta">• ${x}</p>`).join('')}<br><a class="btn" href="colleges.html">Back to Search</a></div></div><br><div class="notice">Demo MVP data. Verify current fees, rankings, courses and admission requirements with official sources before publishing or applying.</div>`:`<div class="empty"><h2>College not found</h2><a class="btn" href="colleges.html">Back to Search</a></div>`;</script></body></html>
