<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>College Details | UniPath</title><link rel="stylesheet" href="style.css"><link rel="icon" href="favicon.svg"></head><body><div id="site-nav"></div>
<main class="page"><div class="container" id="content"></div></main><div id="site-footer"></div><script src="data.js"></script><script src="app.js"></script>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const c=getCollege(new URLSearchParams(location.search).get('id')||'iit-madras');
if(!c){document.getElementById('content').innerHTML='<div class="empty"><h2>Institution not found</h2><a class="btn" href="colleges.html">Back to Search</a></div>'}
else{
 const rows=c.programs.map((p,i)=>`<tr><td><strong>${esc(p.programme||'—')}</strong></td><td>${esc(p.courses||'—')}</td><td>${esc(p.eligibility||'—')}</td><td>${esc(p.entrance||'—')}</td><td>${esc(p.mode||'—')}</td><td>${esc(p.duration||'—')}</td><td>${esc(p.fees||'—')}</td></tr>`).join('');
 document.getElementById('content').innerHTML=`<div class="detail-hero"><div class="eyebrow">FREE-TIER COLLEGE PROFILE</div><h1>${esc(c.name)}</h1><p>${esc(c.category)} · ${c.programs.length} programme entries</p><span class="tag">${c.hostel?'Residential option listed':'Mode varies by programme'}</span></div>
 <div class="detail-grid"><div class="info-card"><h3>Profile Summary</h3><div class="info-row"><span>Dataset category</span><strong>${esc(c.category)}</strong></div><div class="info-row"><span>Programme entries</span><strong>${c.programs.length}</strong></div><div class="info-row"><span>Main entrance route</span><strong>${esc(c.exam||'See programme table')}</strong></div></div>
 <div class="info-card"><h3>Use this profile</h3><p class="meta">The table below preserves the programme, course, eligibility, entrance, mode, duration and fee information supplied in the UniPath free-tier sheet.</p><button class="btn small" onclick="compare('${c.id}')">Add to Compare</button> <button class="btn small outline" onclick="saveTier('${c.id}','dream')">Save as Dream</button> <button class="btn small outline" onclick="saveTier('${c.id}','target')">Target</button> <button class="btn small outline" onclick="saveTier('${c.id}','safe')">Safe</button> <a class="btn small outline" href="colleges.html">Back to Search</a></div></div>
 <section class="panel"><div class="section-head"><div class="eyebrow">ALL FREE-TIER DETAILS</div><h2>Programmes & admission information</h2></div><div class="table-wrap"><table><thead><tr><th>Programme</th><th>Courses offered</th><th>Eligibility</th><th>Entrance / Admission</th><th>Mode</th><th>Duration</th><th>Fees</th></tr></thead><tbody>${rows}</tbody></table></div></section>
 <div class="notice">This page reproduces information from the uploaded UniPath free-tier dataset. Fees, eligibility and admission rules can change, so verify current details with the institution before applying.</div>`;
}
function compare(id){let a=JSON.parse(localStorage.getItem('unipathCompare')||'[]');if(!a.includes(id))a.push(id);if(a.length>2)a=a.slice(-2);localStorage.setItem('unipathCompare',JSON.stringify(a));alert('Added to comparison. Open Compare from the navigation.')}
function saveTier(id,tier){let a=JSON.parse(localStorage.getItem('unipathMatches')||'[]');if(!a.includes(id))a.unshift(id);localStorage.setItem('unipathMatches',JSON.stringify(a));let x=JSON.parse(localStorage.getItem('unipathTiers')||'{}');x[id]=tier;localStorage.setItem('unipathTiers',JSON.stringify(x));alert('Saved to '+tier+'. Open My Shortlist to manage it.')}
</script></body></html>
