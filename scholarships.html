<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scholarship Finder | NIPATH</title><link rel="stylesheet" href="style.css"><link rel="icon" href="favicon.svg"></head><body><div id="site-nav"></div><main class="page"><div class="container"><div class="page-title"><div class="eyebrow">FUNDING</div><h1>Scholarship Finder</h1><p>Use this as a planning workspace. Scholarship eligibility and deadlines can change, so verify every application with the official provider.</p></div><section class="panel"><div class="filters" style="grid-template-columns:1fr 1fr 1fr"><select id="level" class="field"><option>Undergraduate</option><option>Postgraduate</option></select><select id="need" class="field"><option>Any funding need</option><option>Need-based</option><option>Merit-based</option><option>Government scheme</option></select><select id="field" class="field"><option>Any field</option><option>Engineering</option><option>Medical</option><option>Science</option><option>Management</option><option>Law</option><option>Arts / Commerce</option></select></div><button class="btn" style="margin-top:12px" onclick="findScholarships()">Find Funding Options</button></section><div id="scholarships" style="margin-top:18px"></div></div></main><div id="site-footer"></div><script src="data.js"></script><script src="app.js"></script><script>
const scholarshipLeads=[['National Scholarship Portal','Government scheme','Central and state scholarship discovery portal.','Verify current schemes, eligibility and dates on the official portal.'],['INSPIRE Scholarship','Merit / Science','Science-focused undergraduate scholarship route.','Check the current INSPIRE eligibility and application cycle.'],['Institution Scholarships','Merit / Need-based','Many colleges publish their own fee waivers and scholarships.','Check the specific institution’s current scholarship page.'],['State Scholarships','Government scheme','State governments may offer scholarships for eligible residents.','Check your state education/social welfare portal.']];
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function findScholarships(){let n=document.getElementById('need').value;let arr=scholarshipLeads.filter(x=>n==='Any funding need'||x[1].toLowerCase().includes(n.split('-')[0].toLowerCase())||x[1].includes('Government'));document.getElementById('scholarships').innerHTML=`<div class="card-list">${arr.map(x=>`<article class="college-card"><div><div class="rank">${esc(x[1])}</div><h2>${esc(x[0])}</h2><p class="meta">${esc(x[2])}</p><p class="muted">${esc(x[3])}</p></div><span class="score-pill">Planning lead</span></article>`).join('')}</div><div class="notice" style="margin-top:15px">NIPATH does not guarantee scholarship eligibility. Always confirm the current rules, dates and application instructions with the official provider.</div>`}
findScholarships();</script></body></html>
