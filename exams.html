<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrance Exams | UniPath</title><link rel="stylesheet" href="style.css"><link rel="icon" href="favicon.svg"></head><body><div id="site-nav"></div><main class="page"><div class="container"><div class="page-title"><div class="eyebrow">PLAN AHEAD</div><h1>Entrance Exams</h1><p>Major exams students may encounter during college admissions.</p></div><div class="exam-grid" id="exams"></div><br><div class="notice">No invented exam dates here. Add dates only after verifying the official notification for the relevant admission cycle.</div></div></main><div id="site-footer"></div><script src="data.js"></script><script src="app.js"></script><script>document.getElementById('exams').innerHTML=EXAMS.map(e=>`<article class="exam-card"><div class="exam-type">${e.type.toUpperCase()}</div><h3>${e.name}</h3><p class="meta"><strong>Body:</strong> ${e.body}</p><p class="meta"><strong>Mode:</strong> ${e.mode}</p><p class="meta">Check the official notification for eligibility, dates and application instructions.</p></article>`).join('');</script></body></html>
