<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard | UniPath</title><link rel="stylesheet" href="style.css"></head><body><div id="site-nav"></div><main class="page"><div class="container"><div class="page-title"><div class="eyebrow">YOUR UNIPATH</div><h1>Dashboard</h1><p id="welcome">Your saved college planning space.</p></div><div class="dashboard-grid"><div class="dashboard-card"><strong id="saved">0</strong>Saved matches</div><div class="dashboard-card"><strong id="comp">0</strong>Compared</div><div class="dashboard-card"><strong>6</strong>Core tools</div><div class="dashboard-card"><strong>PRO</strong>Preview</div></div><div class="info-card"><h3>Saved shortlist</h3><div id="list"></div></div></div></main><div id="site-footer"></div><script src="data.js"></script><script src="app.js"></script><script>const ids=JSON.parse(localStorage.getItem('unipathMatches')||'[]');saved.textContent=ids.length;comp.textContent=JSON.parse(localStorage.getItem('unipathCompare')||'[]').length;const u=JSON.parse(localStorage.getItem('unipathUser')||'null');welcome.textContent=u?`Welcome${u.name?' '+u.name:''}. Your saved college planning space.`:'Your saved college planning space.';list.innerHTML=ids.length?ids.map(id=>{const c=getCollege(id);return c?`<p><a href="college.html?id=${encodeURIComponent(c.id)}" style="color:#0a397f;font-weight:900">${c.name}</a> · ${c.category}</p>`:''}).join(''):'<p class="muted">Complete Find My College to build your first shortlist.</p>'</script></body></html>
