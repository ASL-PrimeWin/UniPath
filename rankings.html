<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NIRF Rankings | UniPath</title><link rel="stylesheet" href="style.css"><link rel="icon" href="favicon.svg"></head><body><div id="site-nav"></div><main class="page"><div class="container"><div class="page-title"><div class="eyebrow">RANKINGS</div><h1>NIRF Rankings</h1><p>Browse ranking categories in the UniPath MVP.</p></div><div class="category-tabs" id="tabs"></div><div class="table-wrap"><table><thead><tr><th>Rank</th><th>Institution</th><th>Category</th><th>Location</th><th>Fee</th></tr></thead><tbody id="body"></tbody></table></div><br><div class="notice">Demo ranking content. Verify the latest NIRF publication before treating any ranking as current.</div></div></main><div id="site-footer"></div><script src="data.js"></script><script src="app.js"></script><script>let selected='Engineering';NIRF_CATEGORIES.forEach(x=>{let b=document.createElement('button');b.textContent=x;b.onclick=()=>{selected=x;renderTabs();render()};document.getElementById('tabs').appendChild(b)});function renderTabs(){[...document.querySelectorAll('#tabs button')].forEach(b=>b.classList.toggle('active',b.textContent===selected))}function render(){let list=selected==='Engineering'?COLLEGES.filter(c=>c.category==='Engineering'):selected==='Management'?COLLEGES.filter(c=>c.category==='Management'):[];document.getElementById('body').innerHTML=list.length?list.sort((a,b)=>a.rank-b.rank).map(c=>`<tr><td><strong>#${c.rank}</strong></td><td><a href="college.html?id=${c.id}"><strong>${c.name}</strong></a></td><td>${c.category}</td><td>${c.city}, ${c.state}</td><td>${money(c.fees)}</td></tr>`).join(''):`<tr><td colspan="5">Demo data is not available for this category yet.</td></tr>`}renderTabs();render();</script></body></html>
